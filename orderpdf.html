<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KURES 氣味選品訂單確認單</title>
  <!-- OCR 與圖片下載庫 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px;
      color: #334155;
    }
    .wrapper { max-width: 680px; margin: 0 auto; }

    /* 後台輸入區 */
    .admin-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
    }
    .admin-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      color: #1e293b;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #475569; }
    input, textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    textarea { resize: vertical; line-height: 1.5; }
    .upload-box {
      border: 2px dashed #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }
    .status-hint { font-size: 0.8rem; color: #64748b; margin-top: 5px; }

    .btn-download {
      width: 100%;
      background: #5d6d4e;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.2s;
    }
    .btn-download:hover { background: #4a573e; }

    /* ===================================================
       原版 KURES 確認單外觀 (完全還原截圖配色與圓角)
       =================================================== */
    #order-card-container {
      background: #75806c; /* 頂部與外框莫蘭迪綠 */
      padding: 14px 10px 10px 10px;
      border-radius: 26px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 450px;
      margin: 0 auto;
    }

    .order-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px 20px 20px;
      color: #2b2b2b;
    }

    .card-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #55604b;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .order-date {
      font-size: 0.85rem;
      color: #92998d;
    }

    .customer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 0.98rem;
    }
    .customer-name { font-weight: 700; color: #222; }
    .badge-pill {
      background: #edf0eb;
      color: #71806a;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* 商品明細展示區 */
    .item-section {
      margin-bottom: 16px;
    }
    .item-main-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .item-title-display {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.45;
      color: #212529;
      flex: 1;
      padding-right: 12px;
      white-space: pre-wrap;
    }
    .item-price-display {
      font-size: 1.05rem;
      font-weight: 800;
      color: #212529;
      white-space: nowrap;
    }
    .item-subtext-display {
      font-size: 0.82rem;
      color: #a0aec0;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    /* 米黃色客製框 */
    .custom-box {
      background: #fdfaf2;
      border: 1px solid #f6e8cc;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .custom-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #b0742f;
      margin-bottom: 6px;
    }
    .custom-desc {
      font-size: 0.9rem;
      color: #976020;
      line-height: 1.5;
      white-space: pre-wrap;
      margin: 0;
    }

    /* 淺綠色賣貨便框 */
    .shipping-box {
      background: #f5f7f4;
      border: 1px solid #e1e7de;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #495057;
      margin-bottom: 14px;
    }
    .shipping-title {
      font-weight: 700;
      color: #637158;
      margin-bottom: 4px;
    }

    /* 折扣明細與買家實付總計 */
    .pricing-summary {
      border-top: 1px dashed #cbd5e1;
      padding-top: 10px;
      text-align: right;
      font-size: 0.9rem;
    }
    .discount-tag {
      color: #e53e3e;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .total-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #2b2b2b;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- 1. 後台輸入區 -->
  <div class="admin-card">
    <div class="admin-title">📸 賣貨便截圖自動辨識</div>
    <div class="grid-2">
      <div class="upload-box">
        <label>截圖 ①：訂單基本資訊</label>
        <input type="file" id="imgMain" accept="image/*" onchange="runOCR('main')">
        <div id="statusMain" class="status-hint">等待上傳...</div>
      </div>
      <div class="upload-box">
        <label>截圖 ②：收件人資料</label>
        <input type="file" id="imgReceiver" accept="image/*" onchange="runOCR('receiver')">
        <div id="statusReceiver" class="status-hint">等待上傳...</div>
      </div>
    </div>

    <div class="admin-title" style="margin-top: 16px;">✏️ 訂單基本欄位（辨識自動帶入 / 可手動修整）</div>
    <div class="grid-2">
      <div class="form-group">
        <label>客戶姓名（確認單抬頭）</label>
        <input type="text" id="custName" value="Joe" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>訂購日期</label>
        <input type="text" id="orderDate" value="2026/10/13" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>訂單編號</label>
        <input type="text" id="orderNo" value="CM2610137973540" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>付款方式</label>
        <input type="text" id="paymentMethod" value="取貨付款" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>收件人姓名</label>
        <input type="text" id="recipientName" value="林*勳" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>收件人手機</label>
        <input type="text" id="recipientPhone" value="0970***909" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>門市地址</label>
        <input type="text" id="storeAddress" value="竹北門市" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>買家商品總額（含運費）</label>
        <input type="number" id="orderTotal" value="1018" oninput="syncPreview()">
      </div>
    </div>

    <!-- 優惠折扣設定 -->
    <div class="grid-2" style="background: #fef3c7; padding: 12px; border-radius: 8px; margin-bottom: 14px;">
      <div class="form-group">
        <label style="color: #92400e;">優惠 / 折扣名稱</label>
        <input type="text" id="discountTitle" value="專屬折扣" placeholder="例如: 滿千折百" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label style="color: #92400e;">折抵金額 (NT$)</label>
        <input type="number" id="discountValue" value="0" placeholder="例如: 100" oninput="syncPreview()">
      </div>
    </div>

    <!-- 明細貼上與客製手 key 區 -->
    <div class="form-group">
      <label>商品明細（直接貼上客戶給您的明細文字）</label>
      <textarea id="itemDetailText" rows="2" oninput="syncPreview()">精油香氛車用擴香套組 (煦 Glow (甜橙/白玉蘭葉/紅桔/岩蘭草))</textarea>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>規格數量備註（貼上或輸入）</label>
        <input type="text" id="itemSubtext" value="NT$ 980 × 1" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>明細金額顯示 (NT$)</label>
        <input type="number" id="itemPrice" value="980" oninput="syncPreview()">
      </div>
    </div>

    <div class="form-group">
      <label>客製內容備註（手 key 區）</label>
      <textarea id="customNotes" rows="2" oninput="syncPreview()">車用擴香夾客製Joe</textarea>
    </div>

    <button class="btn-download" onclick="exportToImage()">💾 另存成確認單圖片傳給客戶</button>
  </div>

  <!-- 2. 確認單輸出預覽 (完全還原原版排版) -->
  <div id="order-card-container">
    <div class="order-card">
      <div class="card-header">
        <div class="brand-title">KURES 氣味選品訂單確認單</div>
        <div class="order-date">訂購日期：<span id="pvOrderDate">2026/10/13</span></div>
      </div>

      <div class="customer-row">
        <div class="customer-name">客戶姓名：<span id="pvCustName">Joe</span></div>
        <div class="badge-pill">客製專屬確認</div>
      </div>

      <!-- 商品明細 -->
      <div class="item-section">
        <div class="item-main-row">
          <div class="item-title-display" id="pvItemTitle">精油香氛車用擴香套組 (煦 Glow (甜橙/白玉蘭葉/紅桔/岩蘭草))</div>
          <div class="item-price-display">NT$ <span id="pvItemPrice">980</span></div>
        </div>
        <div class="item-subtext-display" id="pvItemSubtext">NT$ 980 × 1</div>
      </div>

      <!-- 客製內容備註 (米黃卡片) -->
      <div class="custom-box">
        <div class="custom-title">客製內容備註：</div>
        <div class="custom-desc" id="pvCustomNotes">車用擴香夾客製Joe</div>
      </div>

      <!-- 賣貨便配送資訊 (淺綠卡片) -->
      <div class="shipping-box">
        <div class="shipping-title">賣貨便配送資訊：</div>
        <div>訂單編號：<span id="pvOrderNo">CM2610137973540</span></div>
        <div>付款方式：<span id="pvPaymentMethod">取貨付款</span></div>
        <div>取件門市：<span id="pvStoreAddress">竹北門市</span></div>
        <div>收件資料：<span id="pvReceiverSummary">林*勳 / 909</span></div>
      </div>

      <!-- 總額與優惠折扣區 -->
      <div class="pricing-summary">
        <div id="pvDiscountRow" class="discount-tag" style="display: none;">
          <span id="pvDiscountTitle">專屬折扣</span>：- NT$ <span id="pvDiscountAmount">0</span>
        </div>
        <div class="total-text">
          買家商品總額（含運）：NT$ <span id="pvFinalTotal">1018</span>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
// 同步更新確認單內容
function syncPreview() {
  document.getElementById('pvCustName').innerText = document.getElementById('custName').value || '-';
  document.getElementById('pvOrderDate').innerText = document.getElementById('orderDate').value || '-';
  document.getElementById('pvOrderNo').innerText = document.getElementById('orderNo').value || '-';
  document.getElementById('pvPaymentMethod').innerText = document.getElementById('paymentMethod').value || '-';
  document.getElementById('pvStoreAddress').innerText = document.getElementById('storeAddress').value || '-';

  // 組合 收件人姓名 + 手機末三碼
  const name = document.getElementById('recipientName').value.trim();
  const phone = document.getElementById('recipientPhone').value.trim();
  const phoneLast3 = phone.length >= 3 ? phone.slice(-3) : phone;
  document.getElementById('pvReceiverSummary').innerText = name ? (phoneLast3 ? `${name} / ${phoneLast3}` : name) : '-';

  // 商品明細與客製
  document.getElementById('pvItemTitle').innerText = document.getElementById('itemDetailText').value;
  document.getElementById('pvItemSubtext').innerText = document.getElementById('itemSubtext').value;
  document.getElementById('pvItemPrice').innerText = document.getElementById('itemPrice').value || '0';
  document.getElementById('pvCustomNotes').innerText = document.getElementById('customNotes').value;

  // 優惠折扣與總計
  const baseTotal = parseFloat(document.getElementById('orderTotal').value) || 0;
  const discountVal = parseFloat(document.getElementById('discountValue').value) || 0;
  const discountName = document.getElementById('discountTitle').value || '優惠折扣';

  if (discountVal > 0) {
    document.getElementById('pvDiscountRow').style.display = 'block';
    document.getElementById('pvDiscountTitle').innerText = discountName;
    document.getElementById('pvDiscountAmount').innerText = discountVal;
  } else {
    document.getElementById('pvDiscountRow').style.display = 'none';
  }

  const finalAmount = Math.max(0, baseTotal - discountVal);
  document.getElementById('pvFinalTotal').innerText = finalAmount;
}

// 增強型 OCR 辨識
async function runOCR(type) {
  const fileInput = type === 'main' ? document.getElementById('imgMain') : document.getElementById('imgReceiver');
  const statusEl = type === 'main' ? document.getElementById('statusMain') : document.getElementById('statusReceiver');

  if (!fileInput.files || fileInput.files.length === 0) return;
  const file = fileInput.files[0];

  statusEl.innerText = '辨識中，請稍候...';

  try {
    const worker = await Tesseract.createWorker('chi_tra+eng');
    const res = await worker.recognize(file);
    const rawText = res.data.text;
    await worker.terminate();

    statusEl.innerText = '辨識完成！';

    if (type === 'main') {
      // 1. 訂購日期
      const dateMatch = rawText.match(/\d{4}\/\d{2}\/\d{2}/);
      if (dateMatch) document.getElementById('orderDate').value = dateMatch[0];

      // 2. 訂單編號 (優先取 CM，次取 CC)
      const cmMatch = rawText.match(/CM\d{12,16}/);
      const ccMatch = rawText.match(/CC\d{12,16}/);
      if (cmMatch) {
        document.getElementById('orderNo').value = cmMatch[0];
      } else if (ccMatch) {
        document.getElementById('orderNo').value = ccMatch[0];
      }

      // 3. 付款方式
      if (rawText.includes('取貨付款') || rawText.includes('尚未付款')) {
        document.getElementById('paymentMethod').value = '取貨付款';
      }

      // 4. 買家商品總額（含運費）
      const totalMatch = rawText.match(/含運費[^\d]*\$?([0-9,]+)/) || rawText.match(/\$([0-9,]+)/);
      if (totalMatch) {
        document.getElementById('orderTotal').value = totalMatch[1].replace(/,/g, '');
      }
    } else {
      // 5. 收件人姓名 (排除按鈕文字)
      const lines = rawText.split('\n');
      let foundName = '';
      for (let line of lines) {
        if (line.includes('姓名')) {
          let clean = line.replace(/姓名/g, '').replace(/[:：]/g, '').replace(/封鎖.*/g, '').trim();
          if (clean) { foundName = clean; break; }
        }
      }
      if (!foundName) {
        const star = rawText.match(/[\u4e00-\u9fa5][\*＊][\u4e00-\u9fa5]/);
        if (star) foundName = star[0];
      }
      if (foundName) document.getElementById('recipientName').value = foundName;

      // 6. 手機
      const phoneMatch = rawText.match(/09\d{2}[*\d]{6}/);
      if (phoneMatch) document.getElementById('recipientPhone').value = phoneMatch[0];

      // 7. 門市地址
      const storeMatch = rawText.match(/([^\n\r]+門市)/);
      if (storeMatch) {
        document.getElementById('storeAddress').value = storeMatch[1].replace(/.*收件地址\s*/, '').trim();
      }
    }

    syncPreview();
  } catch (err) {
    console.error(err);
    statusEl.innerText = '辨識發生錯誤，請手動確認輸入';
  }
}

// 另存高畫質圖片
function exportToImage() {
  const target = document.getElementById('order-card-container');
  const name = document.getElementById('custName').value || '客戶';

  html2canvas(target, {
    scale: 3,
    backgroundColor: null,
    useCORS: true
  }).then(canvas => {
    const a = document.createElement('a');
    a.download = `KURES_訂單確認單_${name}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

// 頁面初次載入
syncPreview();
</script>

</body>
</html>
