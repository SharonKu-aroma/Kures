<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>訂單出貨單生成器</title>
  <!-- 引入 Tesseract.js 用於圖片文字辨識 (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px; background: #f8fafc; color: #334155; }
    .card { max-width: 800px; margin: 0 auto 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    h2 { margin-top: 0; margin-bottom: 16px; color: #1e293b; font-size: 1.25rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 16px; text-align: center; background: #f8fafc; cursor: pointer; }
    .btn { background: #0ea5e9; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0284c7; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .status-text { font-size: 0.85rem; color: #64748b; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
    th { background: #f8fafc; }
    .text-right { text-align: right; }
  </style>
</head>
<body>

<div class="card">
  <h2>1. 上傳賣貨便截圖自動帶入</h2>
  <div class="grid-2">
    <div>
      <label>訂單主資訊截圖 (含訂單編號/金額)</label>
      <input type="file" id="imgMain" accept="image/*" onchange="runOCR('main')">
      <div id="statusMain" class="status-text">待上傳...</div>
    </div>
    <div>
      <label>收件人資訊截圖 (姓名/手機/門市)</label>
      <input type="file" id="imgReceiver" accept="image/*" onchange="runOCR('receiver')">
      <div id="statusReceiver" class="status-text">待上傳...</div>
    </div>
  </div>
</div>

<div class="card">
  <h2>2. 訂單與買家資料確認</h2>
  <div class="grid-2">
    <div class="form-group">
      <label>訂購日期</label>
      <input type="text" id="orderDate" placeholder="YYYY/MM/DD">
    </div>
    <div class="form-group">
      <label>訂單編號</label>
      <input type="text" id="orderNo" placeholder="CC...">
    </div>
    <div class="form-group">
      <label>付款方式</label>
      <input type="text" id="paymentMethod" placeholder="取貨付款">
    </div>
    <div class="form-group">
      <label>收件人姓名</label>
      <input type="text" id="recipientName">
    </div>
    <div class="form-group">
      <label>收件人手機</label>
      <input type="text" id="recipientPhone">
    </div>
    <div class="form-group">
      <label>取貨門市 / 地址</label>
      <input type="text" id="storeAddress">
    </div>
  </div>
</div>

<div class="card">
  <h2>3. 商品明細與優惠折扣</h2>
  <table id="itemTable">
    <thead>
      <tr>
        <th>品項名稱</th>
        <th width="100">數量</th>
        <th width="120">單價</th>
        <th width="120">小計</th>
      </tr>
    </thead>
    <tbody id="itemBody">
      <tr>
        <td><input type="text" class="item-name" value="精油商品" oninput="calculateTotal()"></td>
        <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateTotal()"></td>
        <td><input type="number" class="item-price" value="1018" oninput="calculateTotal()"></td>
        <td class="item-subtotal text-right">NT$ 1018</td>
      </tr>
    </tbody>
  </table>
  
  <div style="margin-top: 14px;">
    <button type="button" class="btn btn-secondary" onclick="addItemRow()">+ 新增明細品項</button>
  </div>

  <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

  <!-- 優惠折抵區 -->
  <div class="grid-2">
    <div class="form-group">
      <label>優惠折抵備註</label>
      <input type="text" id="discountNote" value="促銷優惠折抵" placeholder="例如：滿千折百 / VIP折扣">
    </div>
    <div class="form-group">
      <label>折抵金額 (NT$)</label>
      <input type="number" id="discountAmount" value="0" min="0" oninput="calculateTotal()" placeholder="100">
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>運費 (NT$)</label>
      <input type="number" id="shippingFee" value="0" min="0" oninput="calculateTotal()">
    </div>
    <div class="form-group text-right">
      <label>買家實付總金額 (含運費)</label>
      <div id="finalTotalDisplay" style="font-size: 1.5rem; font-weight: bold; color: #e11d48; margin-top: 6px;">NT$ 1018</div>
    </div>
  </div>
</div>

<script>
// 計算明細、折扣與總額
function calculateTotal() {
  const rows = document.querySelectorAll('#itemBody tr');
  let itemsTotal = 0;
  
  rows.forEach(row => {
    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    const subtotal = qty * price;
    row.querySelector('.item-subtotal').innerText = 'NT$ ' + subtotal;
    itemsTotal += subtotal;
  });

  const discount = parseFloat(document.getElementById('discountAmount').value) || 0;
  const shipping = parseFloat(document.getElementById('shippingFee').value) || 0;
  const grandTotal = Math.max(0, itemsTotal - discount + shipping);

  document.getElementById('finalTotalDisplay').innerText = 'NT$ ' + grandTotal;
}

function addItemRow() {
  const tbody = document.getElementById('itemBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="item-name" placeholder="品項名稱" oninput="calculateTotal()"></td>
    <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateTotal()"></td>
    <td><input type="number" class="item-price" value="0" oninput="calculateTotal()"></td>
    <td class="item-subtotal text-right">NT$ 0</td>
  `;
  tbody.appendChild(tr);
}

// 圖片 OCR 擷取邏輯
async function runOCR(type) {
  const fileInput = type === 'main' ? document.getElementById('imgMain') : document.getElementById('imgReceiver');
  const statusEl = type === 'main' ? document.getElementById('statusMain') : document.getElementById('statusReceiver');
  
  if (!fileInput.files || fileInput.files.length === 0) return;
  const file = fileInput.files[0];

  statusEl.innerText = '正在解析辨識中，請稍候...';

  try {
    const worker = await Tesseract.createWorker('chi_tra+eng');
    const ret = await worker.recognize(file);
    const text = ret.data.text;
    await worker.terminate();

    statusEl.innerText = '辨識完成！';

    if (type === 'main') {
      // 擷取訂購日期 (例 2026/10/13)
      const dateMatch = text.match(/\d{4}\/\d{2}\/\d{2}/);
      if (dateMatch) document.getElementById('orderDate').value = dateMatch[0];

      // 擷取訂單編號 (例 CC2610134838058)
      const noMatch = text.match(/(C[CM]\d{12,15})/);
      if (noMatch) document.getElementById('orderNo').value = noMatch[0];

      // 付款方式
      if (text.includes('取貨付款')) {
        document.getElementById('paymentMethod').value = '取貨付款';
      }

      // 總額 (含運費)
      const priceMatch = text.match(/\$([0-9,]+)/);
      if (priceMatch) {
        const val = priceMatch[1].replace(/,/g, '');
        const rows = document.querySelectorAll('#itemBody tr');
        if (rows.length > 0) {
          rows[0].querySelector('.item-price').value = val;
          calculateTotal();
        }
      }
    } else {
      // 收件人姓名 (抓取 姓名 或 林*勳 等格式)
      const nameMatch = text.match(/姓名\s*[:：]?\s*([^\n\r]+)/);
      if (nameMatch) {
        document.getElementById('recipientName').value = nameMatch[1].replace(/封鎖此使用者/g, '').trim();
      }

      // 手機 (例 0970***909)
      const phoneMatch = text.match(/09\d{2}[*\d]{6}/);
      if (phoneMatch) {
        document.getElementById('recipientPhone').value = phoneMatch[0];
      }

      // 收件門市
      const storeMatch = text.match(/(.+門市)/);
      if (storeMatch) {
        document.getElementById('storeAddress').value = storeMatch[1].replace(/.*收件地址\s*/, '').trim();
      }
    }
  } catch (err) {
    console.error(err);
    statusEl.innerText = '辨識失敗，請直接手動輸入';
  }
}
</script>

</body>
</html>
