<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KURES 訂單確認單生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f7f6f2; 
            color: #333333; 
            -webkit-text-size-adjust: 100%;
        }
        input, textarea, button { font-size: 14px !important; }
    </style>
</head>
<body class="p-3 sm:p-5 max-w-md mx-auto pb-28">

    <!-- 標題列 -->
    <div class="mb-4 text-center pt-1">
        <h1 class="text-xl sm:text-2xl font-bold text-[#748069] tracking-wide">KURES 訂單確認生成器</h1>
        <p class="text-xs text-gray-500 mt-1">貼上 LINE 明細或上傳賣貨便截圖，快速產出確認單</p>
    </div>

    <!-- 輸入區塊 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 mb-5">
        
        <!-- 截圖上傳與 OCR 辨識區 -->
        <div class="mb-4 p-3.5 bg-[#fdfcf8] border border-[#748069]/30 rounded-xl">
            <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-bold text-[#748069] flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    上傳賣貨便截圖自動辨識
                </label>
                <span id="ocr-status" class="text-[10px] text-gray-400">支援上傳 2 張截圖</span>
            </div>
            
            <div class="grid grid-cols-2 gap-2 text-center text-xs">
                <label class="border border-dashed border-gray-300 rounded-lg p-2.5 bg-white cursor-pointer hover:border-[#748069] transition block">
                    <span class="block text-[11px] font-medium text-gray-600 mb-1">圖1: 訂單資訊截圖</span>
                    <span id="img1-label" class="text-[10px] text-gray-400 truncate block">選擇圖片</span>
                    <input type="file" id="upload-order-img" accept="image/*" class="hidden" onchange="handleImageSelected(1, this)">
                </label>
                <label class="border border-dashed border-gray-300 rounded-lg p-2.5 bg-white cursor-pointer hover:border-[#748069] transition block">
                    <span class="block text-[11px] font-medium text-gray-600 mb-1">圖2: 付款與收件人截圖</span>
                    <span id="img2-label" class="text-[10px] text-gray-400 truncate block">選擇圖片</span>
                    <input type="file" id="upload-buyer-img" accept="image/*" class="hidden" onchange="handleImageSelected(2, this)">
                </label>
            </div>
            <button id="ocr-btn" type="button" onclick="runOCR()" class="w-full mt-2 py-2 bg-[#748069]/15 hover:bg-[#748069]/25 text-[#748069] font-bold rounded-lg text-xs transition flex items-center justify-center gap-1">
                開始辨識圖片並填入資料
            </button>
        </div>

        <label class="block text-xs font-bold text-gray-700 mb-1.5">客人的 LINE 預約明細：</label>
        <textarea id="raw-input" rows="4" 
            placeholder="請直接貼上客人的文字訊息，例如：
【KURES 氣味選品預約明細】
・100% 精油櫸木嗅吸棒 (煦 Glow)
  單價: $450 × 2 = $900
・車用擴香夾姓名刻字服務 [Paul]
  單價: $100 × 1 = $100
預估商品總額：NT$ 1,000 元"
            class="w-full text-xs p-3 border border-gray-300 rounded-xl focus:border-[#748069] outline-none leading-relaxed bg-gray-50/50 resize-y"></textarea>

        <!-- 折扣與稱謂 -->
        <div class="grid grid-cols-2 gap-2 mt-3">
            <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1">折扣折抵 (NT$)：</label>
                <input type="number" id="discount-val" placeholder="例如：100" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1">客戶稱謂 (選填)：</label>
                <input type="text" id="cust-name" placeholder="例如：蔡*芯 / 蕭先生" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
            </div>
        </div>

        <!-- 客製備註 -->
        <div class="mt-3">
            <label class="block text-[11px] font-bold text-gray-600 mb-1">客製內容備註 (選填，可由明細自動帶入)：</label>
            <textarea id="custom-notes" rows="2" placeholder="例如：車用擴香夾姓名刻字服務 [Paul]" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white"></textarea>
        </div>

        <!-- 賣貨便訂單資訊 -->
        <div class="mt-4 pt-3 border-t border-gray-100">
            <label class="block text-[11px] font-bold text-[#748069] mb-2">賣貨便訂單資訊：</label>
            <div class="space-y-2">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">訂購時間 (圖一 訂購時間)</label>
                        <input type="text" id="myship-order-time" placeholder="例如：2026/10/13 12:15:20" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">付款方式 (圖二 付款方式)</label>
                        <input type="text" id="myship-pay-method" placeholder="例如：取貨付款 (尚未付款)" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-0.5">訂單編號 (圖一 訂單編號)</label>
                    <input type="text" id="myship-order-no" placeholder="例如：CM2610137986909" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-0.5">買家商品總額（含運費）(圖二 訂單金額)</label>
                    <input type="number" id="myship-grand-total" placeholder="例如：1938" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white font-medium text-[#748069]">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">門市地址 (圖二 收件地址)</label>
                        <input type="text" id="myship-store" placeholder="例如：東興一門市" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">收件人姓名 / 手機 (圖二)</label>
                        <input type="text" id="myship-receiver" placeholder="例如：蔡*芯 0921***423" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-2 mt-4">
            <button onclick="parseAndGenerate()" class="flex-1 bg-[#748069] active:bg-[#5c6653] text-white py-2.5 rounded-xl font-bold text-sm shadow transition">
                生成訂單確認單
            </button>
            <button onclick="clearInput()" class="px-3.5 py-2.5 text-xs text-gray-400 hover:text-gray-600 border border-gray-200 rounded-xl">
                清空
            </button>
        </div>
    </div>

    <!-- 生成預覽卡片 -->
    <div id="result-wrapper" class="hidden space-y-4">

        <!-- 獨立訂單視覺卡片 -->
        <div id="order-card" class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-[#748069]/30 relative overflow-hidden w-full">
            <div class="absolute top-0 left-0 right-0 h-2 bg-[#748069]"></div>

            <div class="text-center pt-2 pb-3 border-b border-gray-100">
                <h2 class="text-lg sm:text-xl font-bold text-[#748069] tracking-wider">KURES 氣味選品訂單確認單</h2>
                <p class="text-[11px] text-gray-400 mt-0.5" id="card-date">訂購時間：2026/10/13 12:15:20</p>
            </div>

            <div class="py-2.5 text-xs text-gray-600 flex justify-between items-center border-b border-gray-100">
                <span>客戶姓名：<strong id="card-cust-name" class="text-gray-800 font-bold">貴賓</strong></span>
                <span class="text-[11px] text-[#748069] bg-[#748069]/10 px-2 py-0.5 rounded-full font-medium">客製專屬確認</span>
            </div>

            <!-- 品項列表 -->
            <div id="card-items" class="py-3 space-y-3 border-b border-gray-100 text-xs"></div>

            <!-- 客製內容備註區塊 -->
            <div id="card-notes-box" class="hidden my-3 p-3 bg-amber-50/70 rounded-xl border border-amber-200/60 text-xs break-words">
                <span class="font-bold text-amber-900 block mb-1">客製內容備註：</span>
                <p id="card-notes-text" class="text-amber-800 leading-relaxed whitespace-pre-line"></p>
            </div>

            <!-- 賣貨便訂單資訊區塊 -->
            <div id="card-myship-box" class="hidden my-3 p-3 bg-[#fdfcf8] rounded-xl border border-[#748069]/25 text-xs space-y-1 break-words">
                <span class="font-bold text-[#748069] block mb-1">賣貨便配送資訊：</span>
                <p id="card-myship-no" class="text-gray-700"></p>
                <p id="card-myship-pay" class="text-gray-700"></p>
                <p id="card-myship-store" class="text-gray-700"></p>
                <p id="card-myship-receiver" class="text-gray-700"></p>
            </div>

            <!-- 金額計算 -->
            <div class="pt-2 space-y-1.5 text-xs text-right">
                <div class="flex justify-between items-center text-gray-500">
                    <span>商品小計</span>
                    <span id="card-subtotal" class="font-medium text-gray-800">NT$ 0</span>
                </div>
                <div id="card-discount-row" class="hidden flex justify-between items-center text-red-500">
                    <span>折扣折抵</span>
                    <span id="card-discount" class="font-medium">- NT$ 0</span>
                </div>
                <div class="flex justify-between items-center text-gray-500">
                    <span>運費判定</span>
                    <span id="card-shipping" class="font-medium">NT$ 0</span>
                </div>
                <div class="flex justify-between items-center text-sm font-bold text-[#748069] pt-2 border-t border-dashed border-gray-200 mt-2">
                    <span>買家商品總額（含運費）</span>
                    <span id="card-total" class="text-base text-red-600 font-bold">NT$ 0</span>
                </div>
            </div>

            <!-- 溫馨備註 -->
            <div class="mt-4 pt-3 border-t border-gray-100 bg-[#fdfcf8] p-3 rounded-xl text-[11px] text-gray-500 leading-relaxed">
                <p>・所有商品皆為 Sharon 精心製作，訂單結帳後 7-14 個工作日出貨，感謝您的耐心等候。</p>
                <p class="mt-1">・請核對以上商品配方、數量與客製內容，確認無誤後我們將開始為您排單製作。</p>
            </div>
        </div>

        <!-- 快捷動作按鈕 -->
        <div class="flex flex-col sm:flex-row gap-2.5 pt-1">
            <button onclick="copyReplyText()" class="w-full bg-[#f1cf71] active:bg-[#e0bc5a] text-[#748069] py-3 rounded-xl font-bold text-xs shadow flex items-center justify-center gap-1.5 transition">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                複製確認文字傳給客人
            </button>
            <button onclick="saveCardAsImage()" class="w-full bg-[#748069] active:bg-[#5c6653] text-white py-3 rounded-xl font-bold text-xs shadow flex items-center justify-center gap-1.5 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                存成確認圖傳給客人
            </button>
        </div>

    </div>

    <script>
        let parsedOrder = {
            customerName: '',
            orderTime: '',
            items: [],
            subtotal: 0,
            discount: 0,
            shippingFee: 0,
            shippingFeeText: '',
            total: 0,
            customNotes: '',
            myshipOrderNo: '',
            myshipPayMethod: '',
            myshipStore: '',
            myshipReceiver: ''
        };

        let file1 = null;
        let file2 = null;
        let ocrFields = { total: null, ship: null, sub: null }; // 圖二辨識到的金額（運費判定用）
        let lastNameGuess = '';                                  // 姓名若是推測補 * 的，記在這裡

        function handleImageSelected(idx, input) {
            if (input.files && input.files[0]) {
                const f = input.files[0];
                if (idx === 1) {
                    file1 = f;
                    document.getElementById('img1-label').innerText = f.name;
                    document.getElementById('img1-label').classList.remove('text-gray-400');
                    document.getElementById('img1-label').classList.add('text-[#748069]', 'font-bold');
                } else {
                    file2 = f;
                    document.getElementById('img2-label').innerText = f.name;
                    document.getElementById('img2-label').classList.remove('text-gray-400');
                    document.getElementById('img2-label').classList.add('text-[#748069]', 'font-bold');
                }
            }
        }

        // ───────────── 圖二辨識強化：影像前處理 ─────────────
        // mode 'clean'：放大 + 取 RGB 最小值當灰階（紅字「尚未付款」會變深、橘色封鎖標籤與橘字手機會被洗白）+ 拉高對比
        // mode 'gray' ：只放大 + 一般灰階（第二輪備援用）
        function loadImageElement(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
                img.src = url;
            });
        }

        // 區域加總（積分圖），用來判斷「橘色塊」vs「橘色細字」
        function boxSum(mask, w, h, R) {
            const W = w + 1;
            const integ = new Int32Array(W * (h + 1));
            for (let y = 0; y < h; y++) {
                let row = 0;
                for (let x = 0; x < w; x++) {
                    row += mask[y * w + x];
                    integ[(y + 1) * W + (x + 1)] = integ[y * W + (x + 1)] + row;
                }
            }
            const out = new Int32Array(w * h);
            for (let y = 0; y < h; y++) {
                const y0 = Math.max(0, y - R), y1 = Math.min(h, y + R + 1);
                for (let x = 0; x < w; x++) {
                    const x0 = Math.max(0, x - R), x1 = Math.min(w, x + R + 1);
                    out[y * w + x] = integ[y1 * W + x1] - integ[y0 * W + x1] - integ[y1 * W + x0] + integ[y0 * W + x0];
                }
            }
            return out;
        }

        // mode 'clean'：取 RGB 最小值當灰階（紅字、橘字變深，淺粉底與灰線變白）
        // mode 'gray' ：一般灰階（備援用）
        // 兩種都會把「封鎖此使用者」橘色標籤洗白，並把標籤位置記在 canvas._badge（姓名就在它左邊）
        async function preprocessImage(file, mode) {
            const img = await loadImageElement(file);
            let scale = Math.min(3, Math.max(1, 1800 / img.naturalWidth));
            const maxPx = 10e6;
            if (img.naturalWidth * img.naturalHeight * scale * scale > maxPx) {
                scale = Math.sqrt(maxPx / (img.naturalWidth * img.naturalHeight));
            }
            const w = Math.round(img.naturalWidth * scale);
            const h = Math.round(img.naturalHeight * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const d = imgData.data;
            const n = w * h;

            // 只洗掉「大面積橘色塊」（封鎖此使用者標籤）；橘色細字（手機號碼）要保留
            const orange = new Uint8Array(n);
            for (let p = 0, i = 0; p < n; p++, i += 4) {
                const r = d[i], g = d[i + 1], b = d[i + 2];
                if (r > 200 && g > 80 && g < 160 && b < 110 && (r - b) > 100) orange[p] = 1;
            }
            const R = Math.max(4, Math.round(8 * scale));
            const win = (2 * R + 1) * (2 * R + 1);
            const dens = boxSum(orange, w, h, R);
            const core = new Uint8Array(n);
            const rowCnt = new Int32Array(h);
            const rowMin = new Int32Array(h).fill(w);
            const rowMax = new Int32Array(h).fill(-1);
            for (let p = 0; p < n; p++) {
                if (orange[p] && dens[p] > 0.45 * win) {
                    core[p] = 1;
                    const x = p % w, y = (p - x) / w;
                    rowCnt[y]++;
                    if (x < rowMin[y]) rowMin[y] = x;
                    if (x > rowMax[y]) rowMax[y] = x;
                }
            }
            // 把有橘色塊的列分成上下幾段（頁首的賣貨便 logo 也是橘色），取最下面那一段當「封鎖此使用者」標籤
            const bands = [];
            for (let y = 0, start = -1, last = -1; y <= h; y++) {
                if (y < h && rowCnt[y] > 0) {
                    if (start < 0) start = y;
                    else if (y - last > 3) { bands.push([start, last]); start = y; }
                    last = y;
                } else if (y === h && start >= 0) {
                    bands.push([start, last]);
                }
            }
            let coreCount = 0, bx0 = w, bx1 = 0, by0 = h, by1 = 0;
            if (bands.length > 0) {
                const band = bands[bands.length - 1];
                by0 = band[0];
                by1 = band[1];
                for (let y = by0; y <= by1; y++) {
                    coreCount += rowCnt[y];
                    if (rowMin[y] < bx0) bx0 = rowMin[y];
                    if (rowMax[y] > bx1) bx1 = rowMax[y];
                }
            }
            // 往外多洗一圈，去掉標籤邊緣的灰色殘影
            const grown = boxSum(core, w, h, Math.ceil(2 * scale));

            for (let p = 0, i = 0; p < n; p++, i += 4) {
                let v;
                if (grown[p] > 0) {
                    v = 255;
                } else if (mode === 'clean') {
                    v = Math.min(d[i], d[i + 1], d[i + 2]);
                } else {
                    v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                }
                d[i] = d[i + 1] = d[i + 2] = v;
            }
            ctx.putImageData(imgData, 0, 0);

            // 標籤大小合理才採用（太小／太大都當作沒找到）
            if (coreCount > 200 && (bx1 - bx0) < 0.6 * w && (by1 - by0) < 0.12 * h) {
                canvas._badge = { x0: bx0, x1: bx1, y0: by0, y1: by1 };
            } else {
                canvas._badge = null;
            }
            return canvas;
        }

        // 把「封鎖此使用者」標籤左邊那一小塊（姓名所在）裁出來，單獨辨識
        function cropLeftOfBadge(canvas) {
            const b = canvas._badge;
            if (!b) return null;
            const H = b.y1 - b.y0;
            const x0 = Math.max(0, Math.round(b.x0 - 0.12 * canvas.width));
            const x1 = Math.max(x0 + 10, b.x0 - 4);
            const y0 = Math.max(0, Math.round(b.y0 - 0.4 * H));
            const y1 = Math.min(canvas.height, Math.round(b.y1 + 0.4 * H));
            const pad = 20;
            const out = document.createElement('canvas');
            out.width = (x1 - x0) + pad * 2;
            out.height = (y1 - y0) + pad * 2;
            const octx = out.getContext('2d');
            octx.fillStyle = '#ffffff';
            octx.fillRect(0, 0, out.width, out.height);
            octx.drawImage(canvas, x0, y0, x1 - x0, y1 - y0, pad, pad, x1 - x0, y1 - y0);
            return out;
        }

        async function runOCR() {
            if (!file1 && !file2) {
                alert('請先選擇截圖！');
                return;
            }

            const status = document.getElementById('ocr-status');
            const btn = document.getElementById('ocr-btn');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            let worker = null;
            let finalMsg = '辨識完成！已自動帶入';

            try {
                // 圖一辨識：訂單資訊
                if (file1) {
                    status.innerText = '辨識圖一 (訂單資訊)...';
                    const res1 = await Tesseract.recognize(file1, 'chi_tra+eng');
                    parseImage1Text(res1.data.text);
                }

                // 圖二辨識：金額（小計／運費／總計）與收件人資料（姓名／手機／門市）
                if (file2) {
                    ocrFields = { total: null, ship: null, sub: null };
                    lastNameGuess = '';

                    status.innerText = '圖二前處理中...';
                    worker = await Tesseract.createWorker('chi_tra+eng');

                    // 第 1 輪：去橘色標籤，整張逐行辨識 (PSM 6)
                    status.innerText = '辨識圖二 (第 1 輪)...';
                    const cleanCanvas = await preprocessImage(file2, 'clean');
                    await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
                    const res2 = await worker.recognize(cleanCanvas);
                    let found = parseImage2GlobalText(res2.data.text, {});

                    status.innerText = '解析姓名與金額...';
                    let nameFound = findBuyerNameSmart(res2.data);
                    let nameConflict = '';

                    // 姓名專用：把標籤左邊那一格裁出來單獨辨識（* 很小，整張辨識最容易漏）
                    const nameCanvas = cropLeftOfBadge(cleanCanvas);
                    if (nameCanvas) {
                        status.innerText = '辨識姓名...';
                        await worker.setParameters({ tessedit_pageseg_mode: '7', preserve_interword_spaces: '1' });
                        const rn = await worker.recognize(nameCanvas);
                        const p = parseNameFromSegment(normalizeOcrText(rn.data.text).replace(/\s*\n\s*/g, ' '));
                        if (p) {
                            const pass1Name = document.getElementById('cust-name').value;
                            if (!nameFound || (lastNameGuess && p.sure)) {
                                // 第 1 輪沒抓到或只是推測 → 用裁切結果
                                applyBuyerName(p);
                                nameFound = true;
                            } else if (p.sure && pass1Name && p.name !== pass1Name) {
                                // 兩次都有結果但不一樣：保留第 1 輪（直接讀「姓名」那一列），提醒確認
                                nameConflict = pass1Name + ' / ' + p.name;
                            }
                        }
                    }

                    const incomplete = () => !(nameFound && !lastNameGuess) || !found.phone || found.total == null || found.ship == null || !found.store;

                    // 備援：一般灰階 + 稀疏文字模式 (PSM 11)，只補沒抓到的欄位
                    if (incomplete()) {
                        status.innerText = '辨識圖二 (補強)...';
                        const grayCanvas = await preprocessImage(file2, 'gray');
                        await worker.setParameters({ tessedit_pageseg_mode: '11', preserve_interword_spaces: '1' });
                        const res2b = await worker.recognize(grayCanvas);
                        found = parseImage2GlobalText(res2b.data.text, found);
                        if (!(nameFound && !lastNameGuess)) {
                            const ok2 = findBuyerNameSmart(res2b.data);
                            nameFound = nameFound || ok2;
                        }
                    }

                    // 付款方式：這張截圖的「付款方式」若是收合的就沒有值，不列入必填
                    const missing = [];
                    if (!nameFound) missing.push('收件人姓名');
                    if (!found.phone) missing.push('手機');
                    if (found.total == null) missing.push('應付總金額');
                    if (found.ship == null) missing.push('運費');
                    if (!found.store) missing.push('門市');

                    const parts = [];
                    if (lastNameGuess) parts.push('姓名「' + lastNameGuess + '」為推測，請確認');
                    if (nameConflict) parts.push('姓名兩次辨識不同（' + nameConflict + '），請確認');
                    if (missing.length > 0) parts.push('「' + missing.join('、') + '」未抓到，請手動填寫');
                    if (found.mismatch) parts.push('小計＋運費≠總額（若有折扣可忽略），請核對金額');
                    if (parts.length > 0) finalMsg = '辨識完成，' + parts.join('；');
                }

                status.innerText = finalMsg;
            } catch (err) {
                console.error(err);
                status.innerText = '辨識失敗，請手動確認';
                alert('圖片辨識過程出現異常，請手動微調欄位。');
            } finally {
                if (worker) {
                    try { await worker.terminate(); } catch (e) {}
                }
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function parseImage1Text(text) {
            const orderNoMatch = text.match(/(?:CM|CC)\d{10,18}/i);
            if (orderNoMatch) {
                document.getElementById('myship-order-no').value = orderNoMatch[0];
            }

            const timeMatch = text.match(/((?:20\d{2})[\/\-\.](?:0?[1-9]|1[0-2])[\/\-\.](?:0?[1-9]|[12]\d|3[01])\s+[0-2]?\d:[0-5]\d(?::[0-5]\d)?)/);
            if (timeMatch) {
                document.getElementById('myship-order-time').value = timeMatch[1].replace(/[\-\.]/g, '/').trim();
            }
        }

        // 把 OCR 常見的「中文字之間被插入空白」「全形括號」清乾淨
        function normalizeOcrText(text) {
            let t = (text || '').replace(/[\u3000\t]+/g, ' ');
            t = t.replace(/（/g, '(').replace(/）/g, ')');
            // 中文與中文（或括號）之間的空白移除；lookahead 不吃字元，所以連續字也能處理
            t = t.replace(/([\u4e00-\u9fa5)])[ ]+(?=[\u4e00-\u9fa5(])/g, '$1');
            return t;
        }

        // 付款方式：先找「付款方式」那一列的值，再用關鍵字分類；容忍 貨/货、款/歀 等常見誤認
        function classifyPayment(s) {
            if (!s) return '';
            if (/取\s*[貨货]\s*付\s*[款歀]|[貨货]\s*到\s*付\s*[款歀]|取\s*[貨货]|尚\s*未\s*付/.test(s)) {
                const hasUnpaid = /尚\s*未|未\s*付/.test(s);
                const hasPaid = /已\s*付/.test(s);
                if (hasPaid && !hasUnpaid) return '取貨付款 (已付款)';
                return '取貨付款 (尚未付款)';
            }
            if (/信\s*用\s*卡/.test(s)) return '信用卡';
            if (/ATM|轉\s*帳|虛\s*擬\s*帳/i.test(s)) return 'ATM 轉帳';
            if (/超\s*商\s*代\s*碼|代\s*碼\s*繳/.test(s)) return '超商代碼繳費';
            if (/LINE\s*Pay/i.test(s)) return 'LINE Pay';
            return '';
        }

        function extractPaymentMethod(rawText) {
            const text = normalizeOcrText(rawText);
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const labelRe = /付\s*[款歀]\s*方\s*[式戎]/;

            // 1) 優先：「付款方式」標籤同一列右側，或標籤單獨一列時取下一列
            const candidates = [];
            for (let i = 0; i < lines.length; i++) {
                if (labelRe.test(lines[i])) {
                    const rest = lines[i].replace(/^.*付\s*[款歀]\s*方\s*[式戎]/, '').replace(/^[\s:：|]+/, '').trim();
                    if (rest) {
                        candidates.push(rest);
                    } else if (lines[i + 1]) {
                        candidates.push(lines[i + 1].replace(/^.*付\s*[款歀]\s*方\s*[式戎]/, '').trim());
                    }
                }
            }
            const fromLabel = classifyPayment(candidates.join(' '));
            if (fromLabel) return fromLabel;

            // 2) 備援：整份文字找關鍵字
            return classifyPayment(text);
        }

        // 一行文字裡的金額：優先抓 $ 後面的數字，沒有 $ 就抓行尾數字；回傳整行所有金額
        function amountsInLine(line) {
            const out = [];
            const re = /[\$＄]\s*(\d{1,3}(?:,\d{3})+|\d{1,7})/g;
            let m;
            while ((m = re.exec(line)) !== null) out.push(parseInt(m[1].replace(/,/g, ''), 10));
            if (out.length === 0) {
                const t = line.match(/(\d{1,3}(?:,\d{3})+|\d{1,7})\s*$/);
                if (t) out.push(parseInt(t[1].replace(/,/g, ''), 10));
            }
            return out;
        }

        function findAmountByLabel(lines, labelRe) {
            for (let i = 0; i < lines.length; i++) {
                if (labelRe.test(lines[i])) {
                    let a = amountsInLine(lines[i]);
                    if (!a.length && lines[i + 1]) a = amountsInLine(lines[i + 1]);
                    if (a.length) return a[a.length - 1];
                }
            }
            return null;
        }

        // 小計 / 運費 / 總計（應付總金額）
        function extractAmounts(lines, text) {
            let total = findAmountByLabel(lines, /應\s*付|總\s*計/);
            if (total == null) total = findAmountByLabel(lines, /訂\s*單\s*金\s*[額頻]/);
            if (total == null) {
                const m = text.match(/(?:金\s*[額頻]|總\s*[額頻])[^\$0-9\n\r]*\$?\s*([0-9,]{2,8})/i);
                if (m) total = parseInt(m[1].replace(/,/g, ''), 10);
            }
            const ship = findAmountByLabel(lines, /[運运]\s*費/);
            const sub = findAmountByLabel(lines, /小\s*計/);
            return { total, ship, sub };
        }

        // 手機：優先「收件人資料」區塊裡的手機（橘字），遮罩字元（* x · 等）一律統一成 ***
        function extractPhone(lines, text) {
            const maskedRe = /([0O]9\d{2})\s*[^\d\s]{1,4}\s*(\d{3})(?!\d)/;
            const plainRe = /[0O]9\d{8}(?!\d)/;
            const fmt = (m) => m[1].replace(/O/g, '0') + '***' + m[2];
            const recIdx = lines.findIndex(l => /收\s*件\s*人/.test(l));
            const scopes = [];
            if (recIdx >= 0) scopes.push(lines.slice(recIdx).join('\n'));
            scopes.push(text);
            for (const sc of scopes) {
                for (const l of sc.split('\n')) {
                    if (/手\s*機/.test(l) && !/訂\s*購\s*人/.test(l)) {
                        let m = l.match(maskedRe);
                        if (m) return fmt(m);
                        m = l.match(plainRe);
                        if (m) return m[0].replace(/O/g, '0');
                    }
                }
                let m = sc.match(maskedRe);
                if (m) return fmt(m);
                m = sc.match(plainRe);
                if (m) return m[0].replace(/O/g, '0');
            }
            return '';
        }

        // prev：上一輪已經抓到的欄位（第 2 輪只補沒抓到的）；回傳合併後的結果
        function parseImage2GlobalText(text, prev) {
            text = normalizeOcrText(text);
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const f = Object.assign({ pay: '', total: null, ship: null, sub: null, phone: '', store: '', mismatch: false }, prev || {});

            // 付款方式（該區塊若收合就沒有值，會略過）
            if (!f.pay) {
                const pay = extractPaymentMethod(text);
                if (pay) {
                    f.pay = pay;
                    document.getElementById('myship-pay-method').value = pay;
                }
            }

            // 小計 / 運費 / 應付總金額
            const amt = extractAmounts(lines, text);
            if (f.total == null && amt.total != null) f.total = amt.total;
            if (f.ship == null && amt.ship != null) f.ship = amt.ship;
            if (f.sub == null && amt.sub != null) f.sub = amt.sub;
            // 三個數字互相推算補洞
            if (f.total != null && f.sub != null && f.ship == null) {
                const diff = f.total - f.sub;
                if (diff >= 0 && diff <= 300) f.ship = diff;
            }
            if (f.total == null && f.sub != null && f.ship != null) f.total = f.sub + f.ship;
            f.mismatch = (f.total != null && f.sub != null && f.ship != null && f.sub + f.ship !== f.total);

            if (f.total != null) {
                document.getElementById('myship-grand-total').value = String(f.total);
            }
            ocrFields = { total: f.total, ship: f.ship, sub: f.sub };

            // 門市地址
            if (!f.store) {
                let store = '';
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/收\s*件\s*地\s*[址止]|收\s*件\s*門\s*市|地\s*[址止]/i.test(line)) {
                        let clean = line.replace(/收\s*件\s*地\s*[址止]|收\s*件\s*門\s*市|地\s*[址止]|[:：]/g, '').trim();
                        if (clean && clean.length >= 2) {
                            store = clean;
                            break;
                        } else if (i + 1 < lines.length) {
                            let nextLine = lines[i + 1].trim();
                            if (nextLine && !nextLine.includes('門市') && nextLine.length <= 8) {
                                nextLine += '門市';
                            }
                            store = nextLine;
                            break;
                        }
                    }
                }
                if (!store || store.length < 2) {
                    const directStoreMatch = text.match(/([一-龥A-Za-z0-9]{2,8}門市)/);
                    if (directStoreMatch) {
                        store = directStoreMatch[1].trim();
                    }
                }
                if (store) {
                    store = store.replace(/[^一-龥A-Za-z0-9]/g, '');
                    f.store = store;
                    document.getElementById('myship-store').value = store;
                }
            }

            // 手機
            if (!f.phone) {
                const phone = extractPhone(lines, text);
                if (phone) {
                    f.phone = phone;
                    const currentName = document.getElementById('cust-name').value || '';
                    document.getElementById('myship-receiver').value = `${currentName} ${phone}`.trim();
                }
            }

            return f;
        }

        // ───────────── 收件人姓名辨識 ─────────────
        // 賣貨便姓名會被遮成「蔡*芯」，OCR 常把 * 讀成 ·、x、。、°… 甚至整個漏掉。
        // 做法：
        //  1. 優先讀「收件人資料」區塊裡的「姓名」那一列（就是要印在確認單上的收件人）
        //  2. 找不到再退到「訂購人姓名」那一列，再退到任何「姓名」列，最後才全文比對
        //  3. 先切掉橘色「封鎖此使用者」標籤文字，再用「中文 + 遮罩字元 + 中文」比對
        //  4. 若 * 被 OCR 漏掉（只剩兩個相鄰中文字），補回中間的 *，並在狀態列提醒確認
        const NAME_MASK_CLASS = '[*＊※·•‧。°゜.,，、xX×+＋\\-－–—_~～]';
        const NAME_MASKED_RE = new RegExp('([\\u4e00-\\u9fa5]{1,3})\\s*(?:' + NAME_MASK_CLASS + '\\s*)+([\\u4e00-\\u9fa5]{1,2})');

        function parseNameFromSegment(seg) {
            if (!seg) return null;
            // 切掉「封鎖此使用者」標籤，避免被當成姓名的一部分
            const cut = seg.search(/封\s*[鎖锁]/);
            if (cut >= 0) seg = seg.slice(0, cut);
            seg = seg.replace(/^[\s:：|]+/, '').trim();
            if (!seg) return null;

            const m = seg.match(NAME_MASKED_RE);
            if (m) {
                const full = m[1] + m[2];
                if (/[門市封鎖]/.test(full)) return null;
                return { name: m[1] + '*' + m[2], sure: true };
            }

            // 只有姓氏 + 遮罩（例如 方*）
            const tail = seg.match(new RegExp('^([\\u4e00-\\u9fa5]{1,3})\\s*(?:' + NAME_MASK_CLASS + '\\s*)+$'));
            if (tail && !/[門市封鎖]/.test(tail[1])) {
                return { name: tail[1] + '*', sure: true };
            }

            // 遮罩字元整個被 OCR 漏掉：只剩 2~4 個中文字 → 補回 *
            const loose = seg.match(/^[^\u4e00-\u9fa5]*([\u4e00-\u9fa5]{2,4})(?![\u4e00-\u9fa5])/);
            if (loose && !/[門市封鎖付款式金額]/.test(loose[1])) {
                const s = loose[1];
                return { name: s.charAt(0) + '*' + s.charAt(s.length - 1), sure: false };
            }
            return null;
        }

        function findBuyerNameSmart(ocrData) {
            const text = normalizeOcrText((ocrData && ocrData.text) || '');
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const afterLabel = (line, labelRe) => line.replace(new RegExp('^.*?' + labelRe.source), '');

            const picks = []; // 依優先順序收集候選

            // 1) 收件人資料區塊裡的「姓名」
            const recIdx = lines.findIndex(l => /收\s*件\s*人/.test(l));
            if (recIdx >= 0) {
                for (let j = recIdx; j < Math.min(lines.length, recIdx + 5); j++) {
                    if (/姓\s*名/.test(lines[j]) && !/訂\s*購\s*人/.test(lines[j])) {
                        picks.push(parseNameFromSegment(afterLabel(lines[j], /姓\s*名/)));
                        break;
                    }
                }
            }

            // 2) 訂購人姓名
            for (const line of lines) {
                if (/訂\s*購\s*人(?:\s*姓\s*名)?/.test(line) && /姓\s*名/.test(line)) {
                    picks.push(parseNameFromSegment(afterLabel(line, /訂\s*購\s*人\s*姓\s*名/)));
                    break;
                }
            }

            // 3) 任何含「姓名」的列
            for (const line of lines) {
                if (/姓\s*名/.test(line)) {
                    picks.push(parseNameFromSegment(afterLabel(line, /姓\s*名/)));
                }
            }

            // 4) 全文比對「中文 + 遮罩 + 中文」
            const all = text.match(new RegExp('[\\u4e00-\\u9fa5]{1,3}\\s*(?:\\*|＊|※|·|•|‧)+\\s*[\\u4e00-\\u9fa5]{1,3}', 'g'));
            if (all) {
                for (const s of all) {
                    const p = parseNameFromSegment(s);
                    if (p && p.sure) { picks.push(p); break; }
                }
            }

            // 先挑「有遮罩字元、確定度高」的，其次才用補 * 的推測結果
            const valid = picks.filter(Boolean);
            let best = valid.find(p => p.sure) || valid[0];
            if (!best) return false;

            // 姓名後面緊貼著標籤殘字（例如「方*傑和」）：若別處有更短、且是它開頭的同名結果，就用短的
            const shorter = valid.find(p => p.sure && p.name !== best.name && best.name.startsWith(p.name) && best.name.length - p.name.length <= 2);
            if (shorter) best = shorter;

            applyBuyerName(best);
            return true;
        }

        function applyBuyerName(best) {
            document.getElementById('cust-name').value = best.name;

            // 同步至收件人欄位（保留已辨識到的手機）
            const currentReceiver = document.getElementById('myship-receiver').value;
            const phoneMatch = currentReceiver.match(/(09[\d\*]{8}|09\d{2}[\-\*]{3,4}\d{3})/);
            const phone = phoneMatch ? phoneMatch[1] : '';
            document.getElementById('myship-receiver').value = `${best.name} ${phone}`.trim();

            lastNameGuess = best.sure ? '' : best.name;
        }

        function clearInput() {
            document.getElementById('raw-input').value = '';
            document.getElementById('discount-val').value = '';
            document.getElementById('cust-name').value = '';
            document.getElementById('custom-notes').value = '';
            document.getElementById('myship-order-time').value = '';
            document.getElementById('myship-pay-method').value = '';
            document.getElementById('myship-order-no').value = '';
            document.getElementById('myship-grand-total').value = '';
            document.getElementById('myship-store').value = '';
            document.getElementById('myship-receiver').value = '';
            document.getElementById('upload-order-img').value = '';
            document.getElementById('upload-buyer-img').value = '';
            document.getElementById('img1-label').innerText = '選擇圖片';
            document.getElementById('img2-label').innerText = '選擇圖片';
            document.getElementById('img1-label').className = 'text-[10px] text-gray-400 truncate block';
            document.getElementById('img2-label').className = 'text-[10px] text-gray-400 truncate block';
            document.getElementById('ocr-status').innerText = '支援上傳 2 張截圖';
            document.getElementById('result-wrapper').classList.add('hidden');
            file1 = null;
            file2 = null;
            ocrFields = { total: null, ship: null, sub: null };
            lastNameGuess = '';
        }

        function parseAndGenerate() {
            const raw = document.getElementById('raw-input').value.trim();
            const custName = document.getElementById('cust-name').value.trim() || '貴賓';
            const discountInput = parseInt(document.getElementById('discount-val').value) || 0;
            let notes = document.getElementById('custom-notes').value.trim();
            
            const myshipTime = document.getElementById('myship-order-time').value.trim();
            const myshipPay = document.getElementById('myship-pay-method').value.trim();
            const myshipNo = document.getElementById('myship-order-no').value.trim();
            const grandTotalInput = document.getElementById('myship-grand-total').value.trim();
            const myshipStore = document.getElementById('myship-store').value.trim();
            const myshipReceiver = document.getElementById('myship-receiver').value.trim();

            const now = new Date();
            const defaultTimeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            const timeStr = myshipTime || defaultTimeStr;

            const lines = raw.split('\n');
            let items = [];
            let currentItemName = '';
            let calculatedSubtotal = 0;
            let autoNotes = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('・') || line.startsWith('-') || line.startsWith('*')) {
                    currentItemName = line.replace(/^[・\-\*]\s*/, '').trim();

                    // 自動擷取刻字／客製項目
                    if (/刻字|刻印|客製|加購/i.test(currentItemName)) {
                        autoNotes.push(currentItemName);
                    }
                } else if (line.includes('單價') || line.includes('×') || line.includes('=')) {
                    const priceMatch = line.match(/\$(\d[\d,]*)/);
                    const qtyMatch = line.match(/[×xX]\s*(\d+)/);
                    const subMatch = line.match(/=\s*\$?(\d[\d,]*)/);

                    let price = priceMatch ? parseInt(priceMatch[1].replace(/,/g, '')) : 0;
                    let qty = qtyMatch ? parseInt(qtyMatch[1]) : 1;
                    let total = subMatch ? parseInt(subMatch[1].replace(/,/g, '')) : (price * qty);

                    if (currentItemName) {
                        items.push({
                            name: currentItemName,
                            price: price,
                            qty: qty,
                            total: total
                        });
                        calculatedSubtotal += total;
                        currentItemName = '';
                    }
                }
            }

            if (calculatedSubtotal === 0) {
                const totalMatch = raw.match(/總額[：:]\s*NT\$?\s*(\d[\d,]*)/i);
                if (totalMatch) {
                    calculatedSubtotal = parseInt(totalMatch[1].replace(/,/g, ''));
                }
            }

            // 圖二辨識到的金額（只在「總額沒被手動改過」時採用）
            const ocrMatchesTotal = ocrFields.total != null && String(ocrFields.total) === grandTotalInput;
            if (calculatedSubtotal === 0 && ocrMatchesTotal && ocrFields.sub != null) {
                calculatedSubtotal = ocrFields.sub;
            }

            // 若使用者未在備註欄手動輸入，自動填入擷取到的客製項目
            if (!notes && autoNotes.length > 0) {
                notes = autoNotes.join('\n');
                document.getElementById('custom-notes').value = notes;
            }

            // 運費判定 = 買家商品總額（含運費） - 優惠(折扣) - 商品小計
            let finalGrandTotal = 0;
            let calculatedShipping = 0;

            if (grandTotalInput !== '') {
                finalGrandTotal = parseInt(grandTotalInput);
                calculatedShipping = finalGrandTotal + discountInput - calculatedSubtotal;
                if (calculatedShipping < 0) calculatedShipping = 0;
                // 截圖上有印運費就直接用截圖的
                if (ocrMatchesTotal && ocrFields.ship != null) calculatedShipping = ocrFields.ship;
            } else {
                calculatedShipping = (calculatedSubtotal - discountInput >= 2000) ? 0 : 38;
                finalGrandTotal = Math.max(0, calculatedSubtotal - discountInput + calculatedShipping);
            }

            let shippingText = calculatedShipping === 0 ? 'NT$ 0 (免運)' : `NT$ ${calculatedShipping.toLocaleString()}`;

            parsedOrder = {
                customerName: custName,
                orderTime: timeStr,
                items: items,
                subtotal: calculatedSubtotal,
                discount: discountInput,
                shippingFee: calculatedShipping,
                shippingFeeText: shippingText,
                total: finalGrandTotal,
                customNotes: notes,
                myshipOrderNo: myshipNo,
                myshipPayMethod: myshipPay,
                myshipStore: myshipStore,
                myshipReceiver: myshipReceiver
            };

            // 渲染至卡片 (訂購時間)
            document.getElementById('card-date').innerText = `訂購時間：${timeStr}`;
            document.getElementById('card-cust-name').innerText = custName;
            document.getElementById('card-subtotal').innerText = `NT$ ${calculatedSubtotal.toLocaleString()}`;

            // 折扣渲染
            const discountRow = document.getElementById('card-discount-row');
            if (discountInput > 0) {
                document.getElementById('card-discount').innerText = `- NT$ ${discountInput.toLocaleString()}`;
                discountRow.classList.remove('hidden');
            } else {
                discountRow.classList.add('hidden');
            }

            document.getElementById('card-shipping').innerText = shippingText;
            document.getElementById('card-total').innerText = `NT$ ${finalGrandTotal.toLocaleString()}`;

            const itemsContainer = document.getElementById('card-items');
            itemsContainer.innerHTML = '';

            if (items.length > 0) {
                items.forEach(it => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-start gap-2';
                    div.innerHTML = `
                        <div class="flex-1 min-w-0 pr-1">
                            <div class="font-medium text-gray-800 break-words leading-snug">${it.name}</div>
                            <div class="text-[11px] text-gray-400 mt-0.5">NT$ ${it.price.toLocaleString()} × ${it.qty}</div>
                        </div>
                        <div class="font-semibold text-gray-800 whitespace-nowrap text-right shrink-0">NT$ ${it.total.toLocaleString()}</div>
                    `;
                    itemsContainer.appendChild(div);
                });
            } else {
                itemsContainer.innerHTML = `<div class="text-gray-400 text-center py-2">商品明細以訂購單為準</div>`;
            }

            // 渲染客製備註
            const notesBox = document.getElementById('card-notes-box');
            if (notes) {
                document.getElementById('card-notes-text').innerText = notes;
                notesBox.classList.remove('hidden');
            } else {
                notesBox.classList.add('hidden');
            }

            // 渲染賣貨便資訊
            const myshipBox = document.getElementById('card-myship-box');
            if (myshipNo || myshipStore || myshipReceiver || myshipPay) {
                document.getElementById('card-myship-no').innerText = myshipNo ? `訂單編號：${myshipNo}` : '';
                document.getElementById('card-myship-pay').innerText = myshipPay ? `付款方式：${myshipPay}` : '';
                document.getElementById('card-myship-store').innerText = myshipStore ? `門市地址：${myshipStore}` : '';
                document.getElementById('card-myship-receiver').innerText = myshipReceiver ? `收件資料：${myshipReceiver}` : '';
                myshipBox.classList.remove('hidden');
            } else {
                myshipBox.classList.add('hidden');
            }

            document.getElementById('result-wrapper').classList.remove('hidden');
            document.getElementById('result-wrapper').scrollIntoView({ behavior: 'smooth' });
        }

        // 複製給客人的回覆文字
        function copyReplyText() {
            let t = `您好 ${parsedOrder.customerName}，已經為您核對並建立專屬預約訂單：\n\n`;
            t += `【KURES 氣味選品訂單確認單】\n`;
            t += `訂購時間：${parsedOrder.orderTime}\n`;
            t += `---------------------------------\n`;
            if (parsedOrder.items.length > 0) {
                parsedOrder.items.forEach(it => {
                    t += `・${it.name}\n  單價: $${it.price.toLocaleString()} × ${it.qty} = $${it.total.toLocaleString()}\n`;
                });
                t += `---------------------------------\n`;
            }
            if (parsedOrder.customNotes) {
                t += `客製備註：${parsedOrder.customNotes}\n`;
                t += `---------------------------------\n`;
            }
            if (parsedOrder.myshipOrderNo || parsedOrder.myshipStore || parsedOrder.myshipReceiver || parsedOrder.myshipPayMethod) {
                t += `賣貨便配送資訊：\n`;
                if (parsedOrder.myshipOrderNo) t += `・訂單編號：${parsedOrder.myshipOrderNo}\n`;
                if (parsedOrder.myshipPayMethod) t += `・付款方式：${parsedOrder.myshipPayMethod}\n`;
                if (parsedOrder.myshipStore) t += `・門市地址：${parsedOrder.myshipStore}\n`;
                if (parsedOrder.myshipReceiver) t += `・收件資料：${parsedOrder.myshipReceiver}\n`;
                t += `---------------------------------\n`;
            }
            t += `商品小計：NT$ ${parsedOrder.subtotal.toLocaleString()} 元\n`;
            if (parsedOrder.discount > 0) {
                t += `折扣折抵：- NT$ ${parsedOrder.discount.toLocaleString()} 元\n`;
            }
            t += `運費判定：${parsedOrder.shippingFeeText}\n`;
            t += `買家商品總額（含運費）：NT$ ${parsedOrder.total.toLocaleString()} 元\n\n`;
            t += `出貨說明：所有商品皆為 Sharon 精心製作，訂單結帳後 7-14 個工作日出貨，感謝您的耐心等候。\n\n`;
            t += `請協助核對以上內容，確認無誤後我們將開始為您排單製作！`;

            navigator.clipboard.writeText(t).then(() => {
                alert('訂單確認文字已複製！可以直接在 LINE 貼上回覆客人。');
            }).catch(() => {
                alert('複製失敗，請手動選取文字。');
            });
        }

        // 存成確認圖
        function saveCardAsImage() {
            const card = document.getElementById('order-card');
            
            html2canvas(card, {
                scale: 3,
                backgroundColor: '#ffffff',
                useCORS: true,
                windowWidth: 420
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                if (isMobile) {
                    const newWin = window.open('');
                    newWin.document.write(`
                        <html style="background:#222; text-align:center; padding:15px; margin:0;">
                        <head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>長按儲存訂單圖</title></head>
                        <body style="margin:0; padding:15px; display:flex; flex-direction:column; align-items:center;">
                            <p style="color:#fff; font-size:13px; margin-bottom:12px; font-family:sans-serif;">長按下方圖片即可「儲存影像」回傳給客人：</p>
                            <img src="${imgData}" style="max-width:100%; height:auto; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.5);" />
                        </body>
                        </html>
                    `);
                } else {
                    const a = document.createElement('a');
                    a.href = imgData;
                    a.download = `KURES_Order_${parsedOrder.customerName || '確認單'}.png`;
                    a.click();
                }
            }).catch(err => {
                alert('產生圖片失敗，請使用上方「複製確認文字」功能。');
            });
        }
    </script>
</body>
