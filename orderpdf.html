<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kures 出貨單與訂單管理系統</title>
  <!-- 引入 Tesseract.js 進行前端無後端 OCR 圖片文字辨識 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #4a5568;
      --accent: #2d3748;
      --bg: #f7fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: #2d3748;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .panel {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.2rem;
      color: var(--accent);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #4a5568;
    }
    input, textarea, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
    }
    textarea {
      resize: vertical;
      line-height: 1.5;
    }
    .file-dropzone {
      border: 2px dashed #cbd5e0;
      padding: 16px;
      text-align: center;
      border-radius: 8px;
      background: #f8fafc;
    }
    .status-badge {
      font-size: 0.82rem;
      color: #718096;
      margin-top: 6px;
    }
    .btn-group {
      text-align: right;
      margin-top: 16px;
    }
    .btn {
      background: #2b6cb0;
      color: #fff;
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #2c5282; }

    /* 出貨單預覽區樣式 (支援直接列印 / PDF 輸出) */
    .sheet-preview {
      background: #fff;
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #2d3748;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .sheet-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .info-table, .content-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .info-table td {
      padding: 6px 10px;
      font-size: 0.92rem;
    }
    .info-title {
      font-weight: bold;
      width: 15%;
      background: #f7fafc;
    }
    .content-table th, .content-table td {
      border: 1px solid #e2e8f0;
      padding: 12px;
      text-align: left;
    }
    .content-table th {
      background: #edf2f7;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .pre-text {
      white-space: pre-wrap;
      font-family: inherit;
      line-height: 1.6;
      margin: 0;
      font-size: 0.92rem;
    }
    .summary-box {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
      font-size: 1rem;
    }
    .summary-box div {
      min-width: 260px;
      text-align: right;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .panel { box-shadow: none; padding: 0; margin-bottom: 0; }
      .sheet-preview { border: none; padding: 0; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 操作面板：僅螢幕顯示，列印時自動隱藏 -->
  <div class="panel no-print">
    <h2>1. 賣貨便截圖自動辨識</h2>
    <div class="grid-2">
      <div class="file-dropzone">
        <label>截圖 ①：訂單基本資訊（含編號、金額）</label>
        <input type="file" id="imgMain" accept="image/*" onchange="processOCR('main')">
        <div id="statusMain" class="status-badge">等待上傳圖片...</div>
      </div>
      <div class="file-dropzone">
        <label>截圖 ②：收件人資料（姓名、手機、門市）</label>
        <input type="file" id="imgReceiver" accept="image/*" onchange="processOCR('receiver')">
        <div id="statusReceiver" class="status-badge">等待上傳圖片...</div>
      </div>
    </div>
  </div>

  <div class="panel no-print">
    <h2>2. 訂單與優惠內容填寫</h2>
    <div class="grid-2">
      <div class="form-group">
        <label>訂購日期</label>
        <input type="text" id="orderDate" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>訂單編號</label>
        <input type="text" id="orderNo" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>付款方式</label>
        <input type="text" id="paymentMethod" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>買家商品總額（含運費）</label>
        <input type="number" id="orderTotal" placeholder="例: 1018" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>收件人姓名</label>
        <input type="text" id="recipientName" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>收件人手機</label>
        <input type="text" id="recipientPhone" oninput="syncPreview()">
      </div>
      <div class="form-group" style="grid-column: span 2;">
        <label>取件門市地址</label>
        <input type="text" id="storeAddress" oninput="syncPreview()">
      </div>
    </div>

    <!-- 優惠與折扣輸入 -->
    <div class="grid-2" style="background: #f8fafc; padding: 14px; border-radius: 8px; margin-bottom: 16px;">
      <div class="form-group">
        <label>優惠 / 折扣名稱</label>
        <input type="text" id="discountName" value="專屬折扣優惠" placeholder="例如：滿額折抵、專屬優惠券" oninput="syncPreview()">
      </div>
      <div class="form-group">
        <label>折扣金額 (NT$)</label>
        <input type="number" id="discountAmount" value="0" min="0" placeholder="例如：100" oninput="syncPreview()">
      </div>
    </div>

    <!-- 客戶明細與客製內容 -->
    <div class="form-group">
      <label>商品明細（直接貼上客戶提供的明細）</label>
      <textarea id="itemsDetail" rows="4" placeholder="在此貼上客戶給您的商品明細內容..." oninput="syncPreview()"></textarea>
    </div>

    <div class="form-group">
      <label>客製內容 / 製作備註（手 key 區）</label>
      <textarea id="customNotes" rows="3" placeholder="手 key 客製內容（如：精油配方比例、刻字姓名、特殊包裝需求...）" oninput="syncPreview()"></textarea>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="window.print()">列印 / 另存 PDF 出貨單</button>
    </div>
  </div>

  <!-- 出貨單列印/預覽區 -->
  <div class="sheet-preview">
    <div class="sheet-header">
      <div>
        <div class="sheet-title">KURES 出貨訂單明細</div>
        <div style="font-size: 0.85rem; color: #718096; margin-top: 4px;">訂單日期：<span id="pvOrderDate">-</span></div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 0.9rem;">訂單編號：<span id="pvOrderNo" style="font-weight: 600;">-</span></div>
        <div style="font-size: 0.85rem; color: #718096;">付款方式：<span id="pvPaymentMethod">-</span></div>
      </div>
    </div>

    <table class="info-table" border="1" bordercolor="#e2e8f0">
      <tr>
        <td class="info-title">收件人</td>
        <td id="pvRecipientName" style="width: 35%;">-</td>
        <td class="info-title">聯絡手機</td>
        <td id="pvRecipientPhone">-</td>
      </tr>
      <tr>
        <td class="info-title">取件門市</td>
        <td colspan="3" id="pvStoreAddress">-</td>
      </tr>
    </table>

    <table class="content-table">
      <thead>
        <tr>
          <th>商品購買明細</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <pre class="pre-text" id="pvItemsDetail">（尚未填寫明細）</pre>
          </td>
        </tr>
      </tbody>
    </table>

    <table class="content-table">
      <thead>
        <tr>
          <th>客製內容與製作備註</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <pre class="pre-text" id="pvCustomNotes">（無客製備註）</pre>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="summary-box">
      <div>
        <div id="pvDiscountRow" style="display: none; color: #e53e3e; margin-bottom: 6px;">
          <span id="pvDiscountName">折扣優惠</span>：- NT$ <span id="pvDiscountAmount">0</span>
        </div>
        <div style="font-size: 1.15rem; font-weight: bold; border-top: 1px solid #cbd5e0; padding-top: 6px;">
          買家商品總額（含運費）：<span style="color: #2b6cb0;">NT$ <span id="pvFinalTotal">0</span></span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// 同步預覽內容
function syncPreview() {
  document.getElementById('pvOrderDate').innerText = document.getElementById('orderDate').value || '-';
  document.getElementById('pvOrderNo').innerText = document.getElementById('orderNo').value || '-';
  document.getElementById('pvPaymentMethod').innerText = document.getElementById('paymentMethod').value || '-';
  document.getElementById('pvRecipientName').innerText = document.getElementById('recipientName').value || '-';
  document.getElementById('pvRecipientPhone').innerText = document.getElementById('recipientPhone').value || '-';
  document.getElementById('pvStoreAddress').innerText = document.getElementById('storeAddress').value || '-';
  
  // 明細與客製內容
  const items = document.getElementById('itemsDetail').value.trim();
  document.getElementById('pvItemsDetail').innerText = items || '（尚未填寫明細）';

  const notes = document.getElementById('customNotes').value.trim();
  document.getElementById('pvCustomNotes').innerText = notes || '（無客製備註）';

  // 優惠折扣與金額計算
  const originalTotal = parseFloat(document.getElementById('orderTotal').value) || 0;
  const discountAmt = parseFloat(document.getElementById('discountAmount').value) || 0;
  const discountName = document.getElementById('discountName').value || '優惠折抵';

  if (discountAmt > 0) {
    document.getElementById('pvDiscountRow').style.display = 'block';
    document.getElementById('pvDiscountName').innerText = discountName;
    document.getElementById('pvDiscountAmount').innerText = discountAmt;
  } else {
    document.getElementById('pvDiscountRow').style.display = 'none';
  }

  // 最終實付總額 (自動扣除折扣)
  const finalTotal = Math.max(0, originalTotal - discountAmt);
  document.getElementById('pvFinalTotal').innerText = finalTotal;
}

// 圖片 OCR 擷取邏輯
async function processOCR(target) {
  const fileInput = target === 'main' ? document.getElementById('imgMain') : document.getElementById('imgReceiver');
  const statusEl = target === 'main' ? document.getElementById('statusMain') : document.getElementById('statusReceiver');

  if (!fileInput.files || fileInput.files.length === 0) return;
  const file = fileInput.files[0];

  statusEl.innerText = '辨識解析中，請稍候...';

  try {
    const worker = await Tesseract.createWorker('chi_tra+eng');
    const res = await worker.recognize(file);
    const text = res.data.text;
    await worker.terminate();

    statusEl.innerText = '辨識完成！已自動帶入';

    if (target === 'main') {
      // 1. 訂購日期
      const dateMatch = text.match(/\d{4}\/\d{2}\/\d{2}/);
      if (dateMatch) document.getElementById('orderDate').value = dateMatch[0];

      // 2. 訂單編號 (支援 CC / CM 開頭)
      const noMatch = text.match(/(C[CM]\d{12,15})/);
      if (noMatch) document.getElementById('orderNo').value = noMatch[0];

      // 3. 付款方式
      if (text.includes('取貨付款')) {
        document.getElementById('paymentMethod').value = '取貨付款';
      }

      // 4. 買家商品總額(含運費)
      const totalMatch = text.match(/\$([0-9,]+)/);
      if (totalMatch) {
        document.getElementById('orderTotal').value = totalMatch[1].replace(/,/g, '');
      }
    } else {
      // 5. 收件人姓名
      const nameMatch = text.match(/姓名\s*[:：]?\s*([^\n\r]+)/);
      if (nameMatch) {
        document.getElementById('recipientName').value = nameMatch[1].replace(/封鎖此使用者/g, '').trim();
      }

      // 6. 手機
      const phoneMatch = text.match(/09\d{2}[*\d]{6}/);
      if (phoneMatch) {
        document.getElementById('recipientPhone').value = phoneMatch[0];
      }

      // 7. 門市地址
      const storeMatch = text.match(/(.+門市)/);
      if (storeMatch) {
        document.getElementById('storeAddress').value = storeMatch[1].replace(/.*收件地址\s*/, '').trim();
      }
    }

    syncPreview();
  } catch (err) {
    console.error(err);
    statusEl.innerText = '辨識失敗，請手動確認輸入';
  }
}
</script>

</body>
</html>
