<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KURES 訂單確認單生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f7f6f2; 
            color: #333333; 
            -webkit-text-size-adjust: 100%;
        }
        input, textarea, button { font-size: 14px !important; }
    </style>
</head>
<body class="p-3 sm:p-5 max-w-md mx-auto pb-28">

    <!-- 標題列 -->
    <div class="mb-4 text-center pt-1">
        <h1 class="text-xl sm:text-2xl font-bold text-[#748069] tracking-wide">KURES 訂單確認生成器</h1>
        <p class="text-xs text-gray-500 mt-1">貼上 LINE 明細或上傳賣貨便截圖，快速產出確認單</p>
    </div>

    <!-- 輸入區塊 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 mb-5">
        
        <!-- 截圖上傳與 OCR 辨識區 -->
        <div class="mb-4 p-3.5 bg-[#fdfcf8] border border-[#748069]/30 rounded-xl">
            <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-bold text-[#748069] flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    上傳賣貨便截圖自動辨識
                </label>
                <span id="ocr-status" class="text-[10px] text-gray-400">支援上傳 2 張截圖</span>
            </div>
            
            <div class="grid grid-cols-2 gap-2 text-center text-xs">
                <label class="border border-dashed border-gray-300 rounded-lg p-2.5 bg-white cursor-pointer hover:border-[#748069] transition block">
                    <span class="block text-[11px] font-medium text-gray-600 mb-1">圖1: 訂單資訊截圖</span>
                    <span id="img1-label" class="text-[10px] text-gray-400 truncate block">選擇圖片</span>
                    <input type="file" id="upload-order-img" accept="image/*" class="hidden" onchange="handleImageSelected(1, this)">
                </label>
                <label class="border border-dashed border-gray-300 rounded-lg p-2.5 bg-white cursor-pointer hover:border-[#748069] transition block">
                    <span class="block text-[11px] font-medium text-gray-600 mb-1">圖2: 付款與收件人截圖</span>
                    <span id="img2-label" class="text-[10px] text-gray-400 truncate block">選擇圖片</span>
                    <input type="file" id="upload-buyer-img" accept="image/*" class="hidden" onchange="handleImageSelected(2, this)">
                </label>
            </div>
            <button id="ocr-btn" type="button" onclick="runOCR()" class="w-full mt-2 py-2 bg-[#748069]/15 hover:bg-[#748069]/25 text-[#748069] font-bold rounded-lg text-xs transition flex items-center justify-center gap-1">
                開始辨識圖片並填入資料
            </button>
        </div>

        <label class="block text-xs font-bold text-gray-700 mb-1.5">客人的 LINE 預約明細：</label>
        <textarea id="raw-input" rows="4" 
            placeholder="請直接貼上客人的文字訊息，例如：
【KURES 氣味選品預約明細】
・100% 精油櫸木嗅吸棒 (煦 Glow)
  單價: $450 × 2 = $900
・車用擴香夾姓名刻字服務 [Paul]
  單價: $100 × 1 = $100
預估商品總額：NT$ 1,000 元"
            class="w-full text-xs p-3 border border-gray-300 rounded-xl focus:border-[#748069] outline-none leading-relaxed bg-gray-50/50 resize-y"></textarea>

        <!-- 折扣與稱謂 -->
        <div class="grid grid-cols-2 gap-2 mt-3">
            <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1">折扣折抵 (NT$)：</label>
                <input type="number" id="discount-val" placeholder="例如：100" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1">客戶稱謂 (選填)：</label>
                <input type="text" id="cust-name" placeholder="例如：蔡*芯 / 蕭先生" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
            </div>
        </div>

        <!-- 客製備註 -->
        <div class="mt-3">
            <label class="block text-[11px] font-bold text-gray-600 mb-1">客製內容備註 (選填，可由明細自動帶入)：</label>
            <textarea id="custom-notes" rows="2" placeholder="例如：車用擴香夾姓名刻字服務 [Paul]" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white"></textarea>
        </div>

        <!-- 賣貨便訂單資訊 -->
        <div class="mt-4 pt-3 border-t border-gray-100">
            <label class="block text-[11px] font-bold text-[#748069] mb-2">賣貨便訂單資訊：</label>
            <div class="space-y-2">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">訂購時間 (圖一 訂購時間)</label>
                        <input type="text" id="myship-order-time" placeholder="例如：2026/10/13 12:15:20" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">付款方式 (圖二 付款方式)</label>
                        <input type="text" id="myship-pay-method" placeholder="例如：取貨付款 (尚未付款)" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-0.5">訂單編號 (圖一 訂單編號)</label>
                    <input type="text" id="myship-order-no" placeholder="例如：CM2610137986909" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-0.5">買家商品總額（含運費）(圖二 訂單金額)</label>
                    <input type="number" id="myship-grand-total" placeholder="例如：1938" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white font-medium text-[#748069]">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">門市地址 (圖二 收件地址)</label>
                        <input type="text" id="myship-store" placeholder="例如：東民門市" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">收件人姓名 / 手機 (圖二)</label>
                        <input type="text" id="myship-receiver" placeholder="例如：蔡*芯 0921***423" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg outline-none bg-white">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-2 mt-4">
            <button onclick="parseAndGenerate()" class="flex-1 bg-[#748069] active:bg-[#5c6653] text-white py-2.5 rounded-xl font-bold text-sm shadow transition">
                生成訂單確認單
            </button>
            <button onclick="clearInput()" class="px-3.5 py-2.5 text-xs text-gray-400 hover:text-gray-600 border border-gray-200 rounded-xl">
                清空
            </button>
        </div>
    </div>

    <!-- 生成預覽卡片 -->
    <div id="result-wrapper" class="hidden space-y-4">

        <!-- 獨立訂單視覺卡片 -->
        <div id="order-card" class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-[#748069]/30 relative overflow-hidden w-full">
            <div class="absolute top-0 left-0 right-0 h-2 bg-[#748069]"></div>

            <div class="text-center pt-2 pb-3 border-b border-gray-100">
                <h2 class="text-lg sm:text-xl font-bold text-[#748069] tracking-wider">KURES 氣味選品訂單確認單</h2>
                <p class="text-[11px] text-gray-400 mt-0.5" id="card-date">訂購時間：2026/10/13 12:15:20</p>
            </div>

            <div class="py-2.5 text-xs text-gray-600 flex justify-between items-center border-b border-gray-100">
                <span>客戶姓名：<strong id="card-cust-name" class="text-gray-800 font-bold">貴賓</strong></span>
                <span class="text-[11px] text-[#748069] bg-[#748069]/10 px-2 py-0.5 rounded-full font-medium">客製專屬確認</span>
            </div>

            <!-- 品項列表 -->
            <div id="card-items" class="py-3 space-y-3 border-b border-gray-100 text-xs"></div>

            <!-- 客製內容備註區塊 -->
            <div id="card-notes-box" class="hidden my-3 p-3 bg-amber-50/70 rounded-xl border border-amber-200/60 text-xs break-words">
                <span class="font-bold text-amber-900 block mb-1">客製內容備註：</span>
                <p id="card-notes-text" class="text-amber-800 leading-relaxed whitespace-pre-line"></p>
            </div>

            <!-- 賣貨便訂單資訊區塊 -->
            <div id="card-myship-box" class="hidden my-3 p-3 bg-[#fdfcf8] rounded-xl border border-[#748069]/25 text-xs space-y-1 break-words">
                <span class="font-bold text-[#748069] block mb-1">賣貨便配送資訊：</span>
                <p id="card-myship-no" class="text-gray-700"></p>
                <p id="card-myship-pay" class="text-gray-700"></p>
                <p id="card-myship-store" class="text-gray-700"></p>
                <p id="card-myship-receiver" class="text-gray-700"></p>
            </div>

            <!-- 金額計算 -->
            <div class="pt-2 space-y-1.5 text-xs text-right">
                <div class="flex justify-between items-center text-gray-500">
                    <span>商品小計</span>
                    <span id="card-subtotal" class="font-medium text-gray-800">NT$ 0</span>
                </div>
                <div id="card-discount-row" class="hidden flex justify-between items-center text-red-500">
                    <span>折扣折抵</span>
                    <span id="card-discount" class="font-medium">- NT$ 0</span>
                </div>
                <div class="flex justify-between items-center text-gray-500">
                    <span>運費判定</span>
                    <span id="card-shipping" class="font-medium">NT$ 0</span>
                </div>
                <div class="flex justify-between items-center text-sm font-bold text-[#748069] pt-2 border-t border-dashed border-gray-200 mt-2">
                    <span>買家商品總額（含運費）</span>
                    <span id="card-total" class="text-base text-red-600 font-bold">NT$ 0</span>
                </div>
            </div>

            <!-- 溫馨備註 -->
            <div class="mt-4 pt-3 border-t border-gray-100 bg-[#fdfcf8] p-3 rounded-xl text-[11px] text-gray-500 leading-relaxed">
                <p>・所有商品皆為 Sharon 精心製作，訂單結帳後 7-14 個工作日出貨，感謝您的耐心等候。</p>
                <p class="mt-1">・請核對以上商品配方、數量與客製內容，確認無誤後我們將開始為您排單製作。</p>
            </div>
        </div>

        <!-- 快捷動作按鈕 -->
        <div class="flex flex-col sm:flex-row gap-2.5 pt-1">
            <button onclick="copyReplyText()" class="w-full bg-[#f1cf71] active:bg-[#e0bc5a] text-[#748069] py-3 rounded-xl font-bold text-xs shadow flex items-center justify-center gap-1.5 transition">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                複製確認文字傳給客人
            </button>
            <button onclick="saveCardAsImage()" class="w-full bg-[#748069] active:bg-[#5c6653] text-white py-3 rounded-xl font-bold text-xs shadow flex items-center justify-center gap-1.5 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                存成確認圖傳給客人
            </button>
        </div>

    </div>

    <script>
        let parsedOrder = {
            customerName: '',
            orderTime: '',
            items: [],
            subtotal: 0,
            discount: 0,
            shippingFee: 0,
            shippingFeeText: '',
            total: 0,
            customNotes: '',
            myshipOrderNo: '',
            myshipPayMethod: '',
            myshipStore: '',
            myshipReceiver: ''
        };

        let file1 = null;
        let file2 = null;

        function handleImageSelected(idx, input) {
            if (input.files && input.files[0]) {
                const f = input.files[0];
                if (idx === 1) {
                    file1 = f;
                    document.getElementById('img1-label').innerText = f.name;
                    document.getElementById('img1-label').classList.remove('text-gray-400');
                    document.getElementById('img1-label').classList.add('text-[#748069]', 'font-bold');
                } else {
                    file2 = f;
                    document.getElementById('img2-label').innerText = f.name;
                    document.getElementById('img2-label').classList.remove('text-gray-400');
                    document.getElementById('img2-label').classList.add('text-[#748069]', 'font-bold');
                }
            }
        }

        async function runOCR() {
            if (!file1 && !file2) {
                alert('請先選擇截圖！');
                return;
            }

            const status = document.getElementById('ocr-status');
            const btn = document.getElementById('ocr-btn');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                // 圖一辨識：訂單資訊
                if (file1) {
                    status.innerText = '辨識圖一 (訂單資訊)...';
                    const res1 = await Tesseract.recognize(file1, 'chi_tra+eng');
                    parseImage1Text(res1.data.text);
                }

                // 圖二辨識：付款與收件人
                if (file2) {
                    status.innerText = '辨識圖二 (整體欄位)...';
                    const res2 = await Tesseract.recognize(file2, 'chi_tra+eng');
                    parseImage2GlobalText(res2.data.text);

                    // 針對「訂購人姓名 / 姓名」雙保險鎖定中文名
                    status.innerText = '精確定位姓名中...';
                    await cropAndRecognizeName(file2, res2.data.words, res2.data.text);
                }

                status.innerText = '辨識完成！已自動帶入';
            } catch (err) {
                console.error(err);
                status.innerText = '辨識失敗，請手動確認';
                alert('圖片辨識過程出現異常，請手動微調欄位。');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function parseImage1Text(text) {
            const orderNoMatch = text.match(/(?:CM|CC)\d{10,18}/i);
            if (orderNoMatch) {
                document.getElementById('myship-order-no').value = orderNoMatch[0];
            }

            const timeMatch = text.match(/((?:20\d{2})[\/\-\.](?:0?[1-9]|1[0-2])[\/\-\.](?:0?[1-9]|[12]\d|3[01])\s+[0-2]?\d:[0-5]\d(?::[0-5]\d)?)/);
            if (timeMatch) {
                document.getElementById('myship-order-time').value = timeMatch[1].replace(/[\-\.]/g, '/').trim();
            }
        }

        function parseImage2GlobalText(text) {
            if (/取\s*貨\s*付\s*款|尚\s*未\s*付\s*款/i.test(text)) {
                document.getElementById('myship-pay-method').value = '取貨付款 (尚未付款)';
            } else if (/信\s*用\s*卡/i.test(text)) {
                document.getElementById('myship-pay-method').value = '信用卡';
            } else if (/ATM|轉\s*帳/i.test(text)) {
                document.getElementById('myship-pay-method').value = 'ATM 轉帳';
            }

            let grandTotal = '';
            const amountMatch = text.match(/(?:訂\s*單\s*金\s*[額頻]|金\s*[額頻]|總\s*[額頻])[^\$0-9\n\r]*\$?\s*([0-9,]{2,8})/i);
            if (amountMatch) {
                grandTotal = amountMatch[1].replace(/,/g, '');
            } else {
                const dollarMatch = text.match(/\$\s*([0-9,]{3,7})/);
                if (dollarMatch) {
                    grandTotal = dollarMatch[1].replace(/,/g, '');
                }
            }
            if (grandTotal) {
                document.getElementById('myship-grand-total').value = grandTotal;
            }

            let store = '';
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (/收\s*件\s*地\s*[址止]|收\s*件\s*門\s*市|地\s*[址止]/i.test(line)) {
                    let clean = line.replace(/收\s*件\s*地\s*[址止]|收\s*件\s*門\s*市|地\s*[址止]|[:：]/g, '').trim();
                    if (clean && clean.length >= 2) {
                        store = clean;
                        break;
                    } else if (i + 1 < lines.length) {
                        let nextLine = lines[i + 1].trim();
                        if (nextLine && !nextLine.includes('門市') && nextLine.length <= 8) {
                            nextLine += '門市';
                        }
                        store = nextLine;
                        break;
                    }
                }
            }
            if (!store || store.length < 2) {
                const directStoreMatch = text.match(/([\u4e00-\u9fa5A-Za-z0-9]{2,8}門市)/);
                if (directStoreMatch) {
                    store = directStoreMatch[1].trim();
                } else if (/東\s*民/i.test(text)) {
                    store = '東民門市';
                }
            }
            if (store) {
                store = store.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
                if (store.includes('東民') && !store.includes('門市')) {
                    store += '門市';
                }
                document.getElementById('myship-store').value = store;
            }

            const phoneMatch = text.match(/(09[\d\*]{8}|09\d{2}[\-\*]{3,4}\d{3})/);
            if (phoneMatch) {
                const currentName = document.getElementById('cust-name').value || '';
                document.getElementById('myship-receiver').value = `${currentName} ${phoneMatch[1].trim()}`.trim();
            }
        }

        // 精準抓取姓名：雙重保險，完全杜絕 E-mail 英文字母干擾
        async function cropAndRecognizeName(imgFile, words, fullText) {
            try {
                let foundName = '';

                // 第 1 步：直接從全文正則抓取「訂購人姓名」或「姓名」後面的純中文+遮罩（排除英文）
                if (fullText) {
                    const textMatch = fullText.match(/(?:訂\s*購\s*人\s*姓\s*名|姓\s*名)\s*[:：]?\s*([\u4e00-\u9fa5][\*·\s]?[\u4e00-\u9fa5]{1,2})/);
                    if (textMatch) {
                        let candidate = textMatch[1].replace(/[\s·]/g, '*').trim();
                        if (candidate.length >= 2 && !candidate.includes('封鎖') && !candidate.includes('門市')) {
                            foundName = candidate;
                        }
                    }
                }

                // 第 2 步：若全文正則沒直接對齊，從單詞隊列中尋找標籤旁邊的純中文
                if (!foundName && words && words.length > 0) {
                    for (let i = 0; i < words.length; i++) {
                        const w = words[i].text.replace(/\s+/g, '');
                        if (w.includes('訂購人姓名') || w.includes('姓名')) {
                            for (let j = 1; j <= 3; j++) {
                                if (i + j < words.length) {
                                    let nextText = words[i + j].text.replace(/[^\u4e00-\u9fa5\*·]/g, '');
                                    if (nextText && nextText.length >= 2 && nextText.length <= 4 && !nextText.includes('封鎖')) {
                                        foundName = nextText.replace('·', '*');
                                        break;
                                    }
                                }
                            }
                        }
                        if (foundName) break;
                    }
                }

                // 第 3 步：若前兩者都沒抓到，針對「訂購人姓名」右側進行座標裁切 OCR（強制排除英文）
                if (!foundName && words && words.length > 0) {
                    let targetBox = null;
                    let charCount = 5;

                    for (let i = 0; i < words.length; i++) {
                        const t = words[i].text.replace(/\s+/g, '');
                        if (t.includes('訂購人姓名')) {
                            targetBox = words[i].bbox;
                            charCount = 5;
                            break;
                        } else if (t.includes('訂購人')) {
                            targetBox = words[i].bbox;
                            charCount = 3;
                            break;
                        }
                    }

                    if (targetBox) {
                        const img = new Image();
                        img.src = URL.createObjectURL(imgFile);
                        await new Promise((res) => { img.onload = res; });

                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        const singleCharWidth = (targetBox.x1 - targetBox.x0) / charCount;
                        const cropX = targetBox.x1 + 6;
                        const cropY = Math.max(0, targetBox.y0 - 5);
                        const cropW = singleCharWidth * 3.4;
                        const cropH = (targetBox.y1 - targetBox.y0) + 10;

                        canvas.width = Math.max(10, cropW);
                        canvas.height = Math.max(10, cropH);
                        ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                        const croppedBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                        const resName = await Tesseract.recognize(croppedBlob, 'chi_tra');
                        let nameText = resName.data.text.trim();

                        // 嚴格過濾：只保留中文和遮罩符號，堅決剔除英文字母
                        nameText = nameText.replace(/[^\u4e00-\u9fa5\*·xX\-\+]/g, '');
                        nameText = nameText.replace(/[·xX\-\+]/g, '*');

                        const match = nameText.match(/([\u4e00-\u9fa5\*]{2,3})/);
                        if (match) {
                            foundName = match[1];
                        }
                    }
                }

                // 回填資料
                if (foundName && foundName.length >= 2) {
                    document.getElementById('cust-name').value = foundName;
                    
                    const phoneMatch = document.getElementById('myship-receiver').value.match(/(09[\d\*]{8}|09\d{2}[\-\*]{3,4}\d{3})/);
                    const phone = phoneMatch ? phoneMatch[1] : '';
                    document.getElementById('myship-receiver').value = `${foundName} ${phone}`.trim();
                }
            } catch (e) {
                console.warn('姓名辨識未成功，請手動確認', e);
            }
        }

        function clearInput() {
            document.getElementById('raw-input').value = '';
            document.getElementById('discount-val').value = '';
            document.getElementById('cust-name').value = '';
            document.getElementById('custom-notes').value = '';
            document.getElementById('myship-order-time').value = '';
            document.getElementById('myship-pay-method').value = '';
            document.getElementById('myship-order-no').value = '';
            document.getElementById('myship-grand-total').value = '';
            document.getElementById('myship-store').value = '';
            document.getElementById('myship-receiver').value = '';
            document.getElementById('upload-order-img').value = '';
            document.getElementById('upload-buyer-img').value = '';
            document.getElementById('img1-label').innerText = '選擇圖片';
            document.getElementById('img2-label').innerText = '選擇圖片';
            document.getElementById('img1-label').className = 'text-[10px] text-gray-400 truncate block';
            document.getElementById('img2-label').className = 'text-[10px] text-gray-400 truncate block';

            file2 = null;
        }

        function parseAndGenerate() {
            const raw = document.getElementById('raw-input').value.trim();
            const custName = document.getElementById('cust-name').value.trim() || '貴賓';
            const discountInput = parseInt(document.getElementById('discount-val').value) || 0;
            let notes = document.getElementById('custom-notes').value.trim();
            
            const myshipTime = document.getElementById('myship-order-time').value.trim();
            const myshipPay = document.getElementById('myship-pay-method').value.trim();
            const myshipNo = document.getElementById('myship-order-no').value.trim();
            const grandTotalInput = document.getElementById('myship-grand-total').value.trim();
            const myshipStore = document.getElementById('myship-store').value.trim();
            const myshipReceiver = document.getElementById('myship-receiver').value.trim();

            const now = new Date();
            const defaultTimeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            const timeStr = myshipTime || defaultTimeStr;

            const lines = raw.split('\n');
            let items = [];
            let currentItemName = '';
            let calculatedSubtotal = 0;
            let autoNotes = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('・') || line.startsWith('-') || line.startsWith('*')) {
                    currentItemName = line.replace(/^[・\-\*]\s*/, '').trim();

                    // 自動擷取刻字／客製項目
                    if (/刻字|刻印|客製|加購/i.test(currentItemName)) {
                        autoNotes.push(currentItemName);
                    }
                } else if (line.includes('單價') || line.includes('×') || line.includes('=')) {
                    const priceMatch = line.match(/\$(\d[\d,]*)/);
                    const qtyMatch = line.match(/[×xX]\s*(\d+)/);
                    const subMatch = line.match(/=\s*\$?(\d[\d,]*)/);

                    let price = priceMatch ? parseInt(priceMatch[1].replace(/,/g, '')) : 0;
                    let qty = qtyMatch ? parseInt(qtyMatch[1]) : 1;
                    let total = subMatch ? parseInt(subMatch[1].replace(/,/g, '')) : (price * qty);

                    if (currentItemName) {
                        items.push({
                            name: currentItemName,
                            price: price,
                            qty: qty,
                            total: total
                        });
                        calculatedSubtotal += total;
                        currentItemName = '';
                    }
                }
            }

            if (calculatedSubtotal === 0) {
                const totalMatch = raw.match(/總額[：:]\s*NT\$?\s*(\d[\d,]*)/i);
                if (totalMatch) {
                    calculatedSubtotal = parseInt(totalMatch[1].replace(/,/g, ''));
                }
            }

            // 若使用者未在備註欄手動輸入，自動填入擷取到的客製項目
            if (!notes && autoNotes.length > 0) {
                notes = autoNotes.join('\n');
                document.getElementById('custom-notes').value = notes;
            }

            // 運費判定 = 買家商品總額（含運費） - 優惠(折扣) - 商品小計
            let finalGrandTotal = 0;
            let calculatedShipping = 0;

            if (grandTotalInput !== '') {
                finalGrandTotal = parseInt(grandTotalInput);
                calculatedShipping = finalGrandTotal + discountInput - calculatedSubtotal;
                if (calculatedShipping < 0) calculatedShipping = 0;
            } else {
                calculatedShipping = (calculatedSubtotal - discountInput >= 2000) ? 0 : 38;
                finalGrandTotal = Math.max(0, calculatedSubtotal - discountInput + calculatedShipping);
            }

            let shippingText = calculatedShipping === 0 ? 'NT$ 0 (免運)' : `NT$ ${calculatedShipping.toLocaleString()}`;

            parsedOrder = {
                customerName: custName,
                orderTime: timeStr,
                items: items,
                subtotal: calculatedSubtotal,
                discount: discountInput,
                shippingFee: calculatedShipping,
                shippingFeeText: shippingText,
                total: finalGrandTotal,
                customNotes: notes,
                myshipOrderNo: myshipNo,
                myshipPayMethod: myshipPay,
                myshipStore: myshipStore,
                myshipReceiver: myshipReceiver
            };

            // 渲染至卡片 (訂購時間)
            document.getElementById('card-date').innerText = `訂購時間：${timeStr}`;
            document.getElementById('card-cust-name').innerText = custName;
            document.getElementById('card-subtotal').innerText = `NT$ ${calculatedSubtotal.toLocaleString()}`;

            // 折扣渲染
            const discountRow = document.getElementById('card-discount-row');
            if (discountInput > 0) {
                document.getElementById('card-discount').innerText = `- NT$ ${discountInput.toLocaleString()}`;
                discountRow.classList.remove('hidden');
            } else {
                discountRow.classList.add('hidden');
            }

            document.getElementById('card-shipping').innerText = shippingText;
            document.getElementById('card-total').innerText = `NT$ ${finalGrandTotal.toLocaleString()}`;

            const itemsContainer = document.getElementById('card-items');
            itemsContainer.innerHTML = '';

            if (items.length > 0) {
                items.forEach(it => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-start gap-2';
                    div.innerHTML = `
                        <div class="flex-1 min-w-0 pr-1">
                            <div class="font-medium text-gray-800 break-words leading-snug">${it.name}</div>
                            <div class="text-[11px] text-gray-400 mt-0.5">NT$ ${it.price.toLocaleString()} × ${it.qty}</div>
                        </div>
                        <div class="font-semibold text-gray-800 whitespace-nowrap text-right shrink-0">NT$ ${it.total.toLocaleString()}</div>
                    `;
                    itemsContainer.appendChild(div);
                });
            } else {
                itemsContainer.innerHTML = `<div class="text-gray-400 text-center py-2">商品明細以訂購單為準</div>`;
            }

            // 渲染客製備註
            const notesBox = document.getElementById('card-notes-box');
            if (notes) {
                document.getElementById('card-notes-text').innerText = notes;
                notesBox.classList.remove('hidden');
            } else {
                notesBox.classList.add('hidden');
            }

            // 渲染賣貨便資訊
            const myshipBox = document.getElementById('card-myship-box');
            if (myshipNo || myshipStore || myshipReceiver || myshipPay) {
                document.getElementById('card-myship-no').innerText = myshipNo ? `訂單編號：${myshipNo}` : '';
                document.getElementById('card-myship-pay').innerText = myshipPay ? `付款方式：${myshipPay}` : '';
                document.getElementById('card-myship-store').innerText = myshipStore ? `門市地址：${myshipStore}` : '';
                document.getElementById('card-myship-receiver').innerText = myshipReceiver ? `收件資料：${myshipReceiver}` : '';
                myshipBox.classList.remove('hidden');
            } else {
                myshipBox.classList.add('hidden');
            }

            document.getElementById('result-wrapper').classList.remove('hidden');
            document.getElementById('result-wrapper').scrollIntoView({ behavior: 'smooth' });
        }

        // 複製給客人的回覆文字
        function copyReplyText() {
            let t = `您好 ${parsedOrder.customerName}，已經為您核對並建立專屬預約訂單：\n\n`;
            t += `【KURES 氣味選品訂單確認單】\n`;
            t += `訂購時間：${parsedOrder.orderTime}\n`;
            t += `---------------------------------\n`;
            if (parsedOrder.items.length > 0) {
                parsedOrder.items.forEach(it => {
                    t += `・${it.name}\n  單價: $${it.price.toLocaleString()} × ${it.qty} = $${it.total.toLocaleString()}\n`;
                });
                t += `---------------------------------\n`;
            }
            if (parsedOrder.customNotes) {
                t += `客製備註：${parsedOrder.customNotes}\n`;
                t += `---------------------------------\n`;
            }
            if (parsedOrder.myshipOrderNo || parsedOrder.myshipStore || parsedOrder.myshipReceiver || parsedOrder.myshipPayMethod) {
                t += `賣貨便配送資訊：\n`;
                if (parsedOrder.myshipOrderNo) t += `・訂單編號：${parsedOrder.myshipOrderNo}\n`;
                if (parsedOrder.myshipPayMethod) t += `・付款方式：${parsedOrder.myshipPayMethod}\n`;
                if (parsedOrder.myshipStore) t += `・門市地址：${parsedOrder.myshipStore}\n`;
                if (parsedOrder.myshipReceiver) t += `・收件資料：${parsedOrder.myshipReceiver}\n`;
                t += `---------------------------------\n`;
            }
            t += `商品小計：NT$ ${parsedOrder.subtotal.toLocaleString()} 元\n`;
            if (parsedOrder.discount > 0) {
                t += `折扣折抵：- NT$ ${parsedOrder.discount.toLocaleString()} 元\n`;
            }
            t += `運費判定：${parsedOrder.shippingFeeText}\n`;
            t += `買家商品總額（含運費）：NT$ ${parsedOrder.total.toLocaleString()} 元\n\n`;
            t += `出貨說明：所有商品皆為 Sharon 精心製作，訂單結帳後 7-14 個工作日出貨，感謝您的耐心等候。\n\n`;
            t += `請協助核對以上內容，確認無誤後我們將開始為您排單製作！`;

            navigator.clipboard.writeText(t).then(() => {
                alert('訂單確認文字已複製！可以直接在 LINE 貼上回覆客人。');
            }).catch(() => {
                alert('複製失敗，請手動選取文字。');
            });
        }

        // 存成確認圖
        function saveCardAsImage() {
            const card = document.getElementById('order-card');
            
            html2canvas(card, {
                scale: 3,
                backgroundColor: '#ffffff',
                useCORS: true,
                windowWidth: 420
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const isMobile = /Android|webOS|iPhone|iPad|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                if (isMobile) {
                    const newWin = window.open('');
                    newWin.document.write(`
                        <html style="background:#222; text-align:center; padding:15px; margin:0;">
                        <head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>長按儲存訂單圖</title></head>
                        <body style="margin:0; padding:15px; display:flex; flex-direction:column; align-items:center;">
                            <p style="color:#fff; font-size:13px; margin-bottom:12px; font-family:sans-serif;">長按下方圖片即可「儲存影像」回傳給客人：</p>
                            <img src="${imgData}" style="max-width:100%; height:auto; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.5);" />
                        </body>
                        </html>
                    `);
                } else {
                    const a = document.createElement('a');
                    a.href = imgData;
                    a.download = `KURES_Order_${parsedOrder.customerName || '確認單'}.png`;
                    a.click();
                }
            }).catch(err => {
                alert('產生圖片失敗，請使用上方「複製確認文字」功能。');
            });
        }
    </script>
